name: Core SDK candidates and strict 0.1.000 publication

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: [v0.1.000]

permissions:
  contents: read
  packages: read

concurrency:
  group: core-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  SDK_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Audit candidate tooling and immutable source inventories
        run: |
          set -euo pipefail
          python -m unittest discover -s packaging/tests -p 'test_*.py' -v
          python tools/check_dependency_boundaries.py
          python tools/check_module_layout.py
          # Inventory status is not the final migration completion decision.
          python tools/check_full_source_migration.py

  candidates:
    name: Candidate ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {id: linux-x64, rid: linux-x64, os: ubuntu-24.04, triplet: x64-linux, host: x64-linux, sanitize: false}
          - {id: linux-arm64, rid: linux-arm64, os: ubuntu-24.04-arm, triplet: arm64-linux, host: arm64-linux, sanitize: false}
          - {id: windows-x64, rid: windows-x64, os: windows-2025, triplet: qigao-x64-windows-v145, host: qigao-x64-windows-v145, sanitize: false}
          - {id: macos-arm64, rid: macos-arm64, os: macos-15, triplet: arm64-osx, host: arm64-osx, sanitize: false}
          - {id: android-arm64-v8a, rid: android-arm64-v8a, os: ubuntu-24.04, triplet: arm64-android, host: x64-linux, sanitize: false}
          - {id: ios-arm64, rid: ios-arm64, os: macos-15, triplet: arm64-ios, host: arm64-osx, sanitize: false}
          - {id: linux-x64-asan-ubsan, rid: linux-x64, os: ubuntu-24.04, triplet: x64-linux, host: x64-linux, sanitize: true}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verified compiler output cache
        id: compiler_cache
        # This fixed action has no Linux ARM64 binary. That row builds uncached.
        if: matrix.id != 'linux-arm64'
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-sdk-${{ matrix.id }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install required Linux native system SDKs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libpipewire-0.3-dev libx11-dev libxext-dev
      - name: Canonical vcpkg and pinned private native dependencies
        id: dependencies
        uses: ./.github/actions/setup-core-native
        env:
          # Preserve the exact source checkout; the pinned action otherwise
          # creates its binary cache under the repository's build directory.
          VCPKG_BINARY_CACHE: ${{ runner.temp }}/core-sdk-vcpkg-binary-cache
        with:
          token: ${{ github.token }}
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.host }}
          manifest-root: .
          features: simd,usb,playback,capture,zstd
      - name: Build full candidate graph, install, relocate and consume
        shell: bash
        env:
          SDK_TOOLCHAIN: ${{ steps.dependencies.outputs.toolchain_file }}
          SDK_SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          set --
          if [ "$SDK_SANITIZE" = true ]; then set -- --sanitize; fi
          python cmake/ci/build_core_sdk.py \
            --rid '${{ matrix.rid }}' --triplet '${{ matrix.triplet }}' \
            --host-triplet '${{ matrix.host }}' --toolchain "$SDK_TOOLCHAIN" \
            --expected-sha "$SDK_EXPECTED_SHA" \
            --output "$RUNNER_TEMP/core-sdk-${{ matrix.id }}" "$@" \
            2>&1 | tee "$RUNNER_TEMP/core-sdk-${{ matrix.id }}.log"
      - name: Publish candidate artifact to this workflow run only
        if: ${{ !matrix.sanitize }}
        uses: actions/upload-artifact@v4
        with:
          name: core-sdk-candidate-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/core-sdk-${{ matrix.id }}/SaltsCore.Native.0.1.000.${{ matrix.rid }}.zip
          if-no-files-found: error
      - name: Record compiler cache statistics
        if: always() && steps.compiler_cache.outcome == 'success'
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-sdk-log-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}.log
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/source.json
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/native-backend.json
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/**/LastTest.log
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/**/ctest-inventory.json
            ${{ runner.temp }}/core-sdk-${{ matrix.id }}/**/ctest-results.xml
          if-no-files-found: warn

  package-candidate:
    needs: [checks, candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: core-sdk-candidate-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/candidates
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify six exact-source candidate archives and assemble SDK roots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'cmake/ci')
          import core_sdk as sdk
          config = sdk.profile()
          source = sdk.identity('.')
          sdk.require(source['clean'] and source['commit'] == os.environ['SDK_EXPECTED_SHA'], 'wrong source checkout')
          temp = Path(os.environ['RUNNER_TEMP'])
          destination = temp / 'combined/sdk'
          destination.mkdir(parents=True)
          seen = set()
          for archive in sorted((temp / 'candidates').glob('*.zip')):
              manifests = sdk.inspect_archive(archive, config)
              sdk.require(len(manifests) == 1, 'per-RID artifact contains multiple SDKs')
              rid, manifest = next(iter(manifests.items()))
              sdk.require(rid not in seen and manifest['source'] == source, 'duplicate or wrong-source RID')
              expected = 'cross-compiled-consumer' if rid in sdk.CROSS_RIDS else 'native-ctest'
              sdk.require(manifest['execution'] == expected, 'candidate consumer was not qualified')
              sdk.require(manifest['native_backend']['status'] == 'selected', 'unsupported backend')
              extracted = temp / ('unpack-' + rid)
              sdk.extract_archive(archive, extracted, config)
              shutil.move(extracted / 'sdk' / rid, destination / rid)
              seen.add(rid)
          sdk.require(seen == sdk.RIDS, 'not all six genuine RID candidates arrived')
          project = temp / 'pack-project'
          project.mkdir()
          for name in ('SaltsCore.Native.csproj', 'README.md'):
              shutil.copyfile(Path('packaging/nuget') / name, project / name)
          PY
          dotnet pack "$RUNNER_TEMP/pack-project/SaltsCore.Native.csproj" \
            --configuration Release --output "$RUNNER_TEMP/package" \
            "-p:PackageRoot=$RUNNER_TEMP/combined" "-p:RepositoryCommit=$SDK_EXPECTED_SHA"
          python cmake/ci/core_sdk.py verify-archive --nuget --require-six-rids \
            --source-root . --archive "$RUNNER_TEMP/package/SaltsCore.Native.0.1.0.nupkg"
      - name: Consume actual NuGet payload in an independent Linux C11 and C++17 graph
        shell: bash
        run: |
          set -euo pipefail
          python cmake/ci/core_sdk.py extract --nuget \
            --archive "$RUNNER_TEMP/package/SaltsCore.Native.0.1.0.nupkg" \
            --output "$RUNNER_TEMP/nupkg-consumer-input"
          prefix="$RUNNER_TEMP/nupkg-consumer-input/sdk/linux-x64"
          cmake -S tests/installed -B "$RUNNER_TEMP/packed-consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSALTSCORE_REQUIRE_SIMD=ON "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build "$RUNNER_TEMP/packed-consumer" --parallel 2
          LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir "$RUNNER_TEMP/packed-consumer" --no-tests=error --output-on-failure --timeout 180
          (cd "$RUNNER_TEMP/package" && sha256sum SaltsCore.Native.0.1.0.nupkg > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: core-nupkg-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error

  final-migration:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.000'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete original 2975-file and 610-API migration evidence
        run: python tools/check_full_source_migration.py --require-complete

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.000' && github.repository == 'qigao/salts-core'
    needs: [package-candidate, final-migration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: core-nupkg-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/publish
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Recheck exact source, tag, full targets, complete migration and archive bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/publish" && sha256sum --check SHA256SUMS)
          python cmake/ci/core_sdk.py release-check \
            --archive "$RUNNER_TEMP/publish/SaltsCore.Native.0.1.0.nupkg" \
            --source-root . --expected-sha "$SDK_EXPECTED_SHA" --tag v0.1.000
      - name: Recheck remote tag and refuse existing release or equivalent NuGet version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          def get(path):
              req = urllib.request.Request('https://api.github.com' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          remote = get('/repos/qigao/salts-core/git/ref/tags/v0.1.000')
          if remote is None:
              raise SystemExit('Qualified release tag no longer exists remotely')
          target = remote['object']
          for depth in range(10):
              if target['type'] != 'tag':
                  break
              annotated = get('/repos/qigao/salts-core/git/tags/' + target['sha'])
              if annotated is None:
                  raise SystemExit('Annotated release tag cannot be resolved')
              target = annotated['object']
          if target['type'] != 'commit' or target['sha'] != os.environ['SDK_EXPECTED_SHA']:
              raise SystemExit('Remote tag moved away from the qualified source commit')
          if get('/repos/qigao/salts-core/releases/tags/v0.1.000') is not None:
              raise SystemExit('Release already exists; explicit recovery is required')
          def equivalent(version):
              core = version.split('+', 1)[0]
              if '-' in core:
                  return False
              fields = core.split('.')
              if not 2 <= len(fields) <= 4 or not all(p.isdigit() for p in fields):
                  raise SystemExit('Unrecognized existing NuGet version: ' + version)
              numbers = list(map(int, fields))
              numbers += [0] * (4 - len(numbers))
              return numbers == [0, 1, 0, 0]
          for page in range(1, 1001):
              versions = get('/users/qigao/packages/nuget/SaltsCore.Native/versions?per_page=100&page=' + str(page))
              if versions is None:
                  if page != 1:
                      raise SystemExit('Package versions disappeared during the uniqueness check')
                  break
              if any(equivalent(v['name']) for v in versions):
                  raise SystemExit('Equivalent NuGet version already exists; never overwrite or skip duplicates')
              if len(versions) < 100:
                  break
          else:
              raise SystemExit('NuGet uniqueness pagination did not finish')
          PY
      - name: Publish the qualified immutable NuGet and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/core-nuget.config"
          python - "$config" <<'PY'
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_text('<configuration><packageSources><clear /></packageSources></configuration>\n')
          PY
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GH_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push "$RUNNER_TEMP/publish/SaltsCore.Native.0.1.0.nupkg" \
            --api-key "$GH_TOKEN" --source github --configfile "$config"
          gh release create v0.1.000 "$RUNNER_TEMP/publish/SaltsCore.Native.0.1.0.nupkg" \
            "$RUNNER_TEMP/publish/SHA256SUMS" --repo qigao/salts-core \
            --verify-tag --target "$SDK_EXPECTED_SHA" --title 'SaltsCore 0.1.000' \
            --notes 'Display/tag version: 0.1.000 / v0.1.000. NuGet/CMake version: 0.1.0. Six RID native SDKs; exact source and per-file hashes are in each SDK manifest. This release is admitted only after the complete migration and platform gates.'
