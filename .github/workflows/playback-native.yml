name: SaltsCore original native Playback
on:
  pull_request:
    paths:
      - "playback/**"
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "concurrency/**"
      - "platform/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/playback-native.yml"
      - ".github/actions/setup-core-native/**"
      - "crypto/native/**"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: saltscore-playback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Preserve source-lock Git blob bytes from the initial checkout.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  playback:
    name: "Playback ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            triplet: x64-linux
            flags: ""
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            triplet: x64-linux
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - os: ubuntu-24.04
            profile: linux-tsan
            triplet: x64-linux
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - os: windows-2025
            profile: windows-release
            triplet: qigao-x64-windows-v145
            flags: ""
          - os: macos-15
            profile: macos-release
            triplet: arm64-osx
            flags: ""
    env:
      PLAYBACK_FLAGS: ${{ matrix.flags }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-playback-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the original pinned miniaudio dependency
        id: cache
        uses: ./.github/actions/setup-core-native
        with:
          token: ${{ github.token }}
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.triplet }}
          features: playback
      - name: Build the complete configured graph and production DSO
        shell: bash
        env:
          PLAYBACK_TOOLCHAIN: ${{ steps.cache.outputs.toolchain_file }}
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$PLAYBACK_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$PLAYBACK_FLAGS" "-DCMAKE_CXX_FLAGS=$PLAYBACK_FLAGS")
          fi
          cmake -S . -B build-playback -G Ninja \
            -DBUILD_TESTING=ON -DSALTSCORE_BUILD_PLAYBACK=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$PLAYBACK_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_FEATURES=playback \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/playback-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-playback --config Release --parallel 2
          for case in original_buffer original_lifecycle production_contract source_provenance; do
            ctest --test-dir build-playback -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^saltscore[.]playback_${case}$"
          done
          cmake --install build-playback --config Release
      - name: Execute production installed C11 and C++17 contracts
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$PLAYBACK_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$PLAYBACK_FLAGS" "-DCMAKE_CXX_FLAGS=$PLAYBACK_FLAGS")
          fi
          case "$RUNNER_OS" in
            Windows) export PATH="$(cygpath -u "$RUNNER_TEMP")/playback-sdk/bin:$PATH" ;;
            macOS) export DYLD_LIBRARY_PATH="$RUNNER_TEMP/playback-sdk/lib:${DYLD_LIBRARY_PATH:-}" ;;
            Linux) export LD_LIBRARY_PATH="$RUNNER_TEMP/playback-sdk/lib:${LD_LIBRARY_PATH:-}" ;;
          esac
          cmake -S playback/tests/installed -B build-playback-installed -G Ninja \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/playback-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-playback-installed --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir build-playback-installed -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^sdk[.]playback_${lang}$"
          done
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-playback/Testing/Temporary/LastTest.log
            build-playback-installed/Testing/Temporary/LastTest.log
          if-no-files-found: error
