name: SaltsCore static SIMD source and installed ABI

on:
  pull_request:
    paths:
      - "simd/**"
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "tools/migration/original-simd-inventory.json"
      - "tools/check_dependency_boundaries.py"
      - "tools/check_migration_evidence.py"
      - "tools/migration/native-evidence-contracts.json"
      - "tests/test_migration_evidence.py"
      - "tests/test_original_simd_provenance.py"
      - "tests/CMakeLists.txt"
      - "tests/installed/CMakeLists.txt"
      - "tests/installed/simd_consumer.*"
      - ".github/workflows/simd-native.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Cancel obsolete work for this PR; run one matrix entry at a time.
concurrency:
  group: saltscore-simd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  simd:
    name: "SIMD ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            triplet: x64-linux
            sanitize: false
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            triplet: x64-linux
            sanitize: true
          - os: windows-2025
            profile: windows-release
            triplet: qigao-x64-windows-v145
            sanitize: false
          - os: macos-15
            profile: macos-release
            triplet: arm64-osx
            sanitize: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verified compiler output cache
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-simd-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical vcpkg and curl-only cached SIMDe dependency
        id: cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.triplet }}
          features: simd
      - name: Audit complete source inventories and native dependency direction
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dependency_boundaries.py
          python tools/check_module_layout.py
          python tools/check_full_source_migration.py
          python -m unittest discover -s tests -p test_original_simd_provenance.py -v
      - name: Configure and build the complete native graph
        shell: bash
        env:
          SIMD_TOOLCHAIN: ${{ steps.cache.outputs.toolchain_file }}
          SIMD_SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$SIMD_SANITIZE" == true ]]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags")
          fi
          cmake -S . -B "$RUNNER_TEMP/simd-native-build" -G Ninja \
            -DBUILD_TESTING=ON \
            -DSALTSCORE_BUILD_SIMD=ON -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$SIMD_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_FEATURES=simd \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/simd-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build "$RUNNER_TEMP/simd-native-build" --config Release --parallel 2
      - name: Execute original numeric cases and native failure contracts
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          for case in simd_original_c11 simd_original_cpp17 simd_native_boundaries \
                      original_simd_source_provenance all_original_source_provenance \
                      all_original_source_negative; do
            ctest --test-dir "$RUNNER_TEMP/simd-native-build" -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^saltscore[.]${case}$"
          done
          cmake --install "$RUNNER_TEMP/simd-native-build" --config Release
      - name: Require the static SIMD archive and reject a SIMD runtime library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          prefix = Path(os.environ["RUNNER_TEMP"]) / "simd-sdk"
          artifacts = sorted(
              path for path in prefix.rglob("*")
              if path.is_file() and path.name.lower().startswith(
                  ("saltscore_simd", "libsaltscore_simd")))
          expected = ("saltscore_simd.lib" if os.environ["RUNNER_OS"] == "Windows"
                      else "libsaltscore_simd.a")
          if len(artifacts) != 1 or artifacts[0].name != expected:
              raise SystemExit(f"Expected only {expected}; found {artifacts}")
          print(f"Static SIMD archive: {artifacts[0]}")
          PY
      - name: Build and execute independent installed C11 and C++17 consumers
        shell: bash
        env:
          SIMD_SANITIZE: ${{ matrix.sanitize }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$SIMD_SANITIZE" == true ]]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags")
          fi
          cmake -S tests/installed -B "$RUNNER_TEMP/simd-installed-build" -G Ninja \
            -DSALTSCORE_REQUIRE_SIMD=ON \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/simd-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build "$RUNNER_TEMP/simd-installed-build" --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir "$RUNNER_TEMP/simd-installed-build" -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^sdk[.]simd_${lang}$"
          done
      - name: Collect actual native and installed SIMD execution evidence
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/check_migration_evidence.py collect \
            --native-build "$RUNNER_TEMP/simd-native-build" \
            --installed-build "$RUNNER_TEMP/simd-installed-build" \
            --sdk-prefix "$RUNNER_TEMP/simd-sdk" \
            --profile '${{ matrix.profile }}' \
            --output "$RUNNER_TEMP/simd-evidence/${{ matrix.profile }}"
          python -B tools/check_migration_evidence.py verify \
            --evidence-dir "$RUNNER_TEMP/simd-evidence"
      - name: Retain exact-source execution evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: simd-evidence-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/simd-evidence/${{ matrix.profile }}
          if-no-files-found: error
      - name: Record real compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simd-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/simd-native-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/simd-installed-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
