name: SaltsCore CNet pinned-provider qualification
on:
  pull_request:
    paths:
      - ".github/actions/setup-ccache/**"
      - "cnet/CMakeLists.txt"
      - "core/CMakeLists.txt"
      - "platform/CMakeLists.txt"
      - "native-io/CMakeLists.txt"
      - "concurrency/CMakeLists.txt"
      - "uri/CMakeLists.txt"
      - "coroutine/CMakeLists.txt"
      - "cnet/src/**"
      - "cnet/include/**"
      - "core/src/**"
      - "core/include/**"
      - "platform/src/**"
      - "platform/include/**"
      - "native-io/src/**"
      - "native-io/include/**"
      - "concurrency/src/**"
      - "concurrency/include/**"
      - "uri/src/**"
      - "uri/include/**"
      - "uri/parser/**"
      - "vendor/cnet/**"
      - "vendor/CMakeLists.txt"
      - "cmake/**"
      - "CMakeLists.txt"
      - "tools/audit_runtime_owner.py"
      - "tests/test_audit_runtime_owner.py"
      - "tests/installed/abi_owner_consumer.c"
      - "tests/installed/CMakeLists.txt"
      - "tests/runtime_loaded_plugin.c"
      - "tests/test_runtime_plugins.c"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/ci/github-packages.py"
      - ".github/workflows/cnet-provider.yml"
      - "tests/installed/cnet_consumer.*"
      - "tests/test_gmssl_*.c"
      - "tests/test_cnet_tcp_loopback.c"
      - "tests/cnet-owner/**"
      - "tests/test_cnet_tls_ca_san.c"
      - "tests/fixtures/**"
      - "tests/CMakeLists.txt"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: saltscore-fifo-workflows
  cancel-in-progress: false
  queue: max

jobs:
  linux-cnet:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact re2c from shared vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
      - name: Install C11 build tools and host re2c
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool \
            curl zip unzip tar
      - name: Restore immutable vcpkg ABI packages (curl-only)
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: .
          features: cnet
      - name: Configure explicit CNet provider graph
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON -DSALTSCORE_CNET_OWNER_SOURCE_TESTS=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/saltscore-sdk"
          cmake --build build-cnet --parallel 2
          ctest --test-dir build-cnet --output-on-failure -C Release --no-tests=error
          # A provider link alone is not network conformance: execute real TCP.
          ctest --test-dir build-cnet --output-on-failure -C Release \
            -R '^saltscore[.]cnet_tcp_loopback$' --no-tests=error
          # Original native Owner: pooled buffer stays alive through deadline,
          # real partial terminal and final retirement (not mock completion).
          ctest --test-dir build-cnet --output-on-failure -C Release \
            -R '^saltscore[.]cnet_owner_original$' --no-tests=error
          # Actual TCP TLS peer verification: CA + hostname must be enforced.
          ctest --test-dir build-cnet --output-on-failure -C Release \
            -R '^saltscore[.]cnet_tls_ca_san$' --no-tests=error
          # Exact required pinned-provider gates, in addition to all CTests.
          ctest --test-dir build-cnet --output-on-failure -C Release \
            -R '^saltscore[.]gmssl_(tls_io_abi|shangmi_provider)$' --no-tests=error
          cmake --install build-cnet --config Release
      - name: Real installed CNet C11/C++17 consumer
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/saltscore-sdk/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S tests/installed -B build-installed-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/saltscore-sdk"
          cmake --build build-installed-cnet --parallel 2
          ctest --test-dir build-installed-cnet --output-on-failure -C Release --no-tests=error
          test -f "$RUNNER_TEMP/saltscore-sdk/include/cnet/cnet.h"
          grep -Fq 'Salts::CNet' "$RUNNER_TEMP/saltscore-sdk/lib/cmake/SaltsCore/SaltsCoreTargets.cmake"
      - name: Audit installed ELF exports and consumer DT_NEEDED
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_audit_runtime_owner
          python3 tools/audit_runtime_owner.py \
            --prefix "$RUNNER_TEMP/saltscore-sdk" \
            --build-dir build-installed-cnet \
            --report build/abi-audit-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-audit-linux
          path: build/abi-audit-linux.json
          if-no-files-found: ignore
      - name: Relocate installed Linux SDK and repeat C11/C++17 and ABI audit
        shell: bash
        run: |
          set -euo pipefail
          relocated="$RUNNER_TEMP/saltscore-sdk-relocated"
          test ! -e "$relocated"
          mv "$RUNNER_TEMP/saltscore-sdk" "$relocated"
          test ! -e "$RUNNER_TEMP/saltscore-sdk"
          export LD_LIBRARY_PATH="$relocated/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S tests/installed -B build-relocated-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$relocated"
          cmake --build build-relocated-cnet --parallel 2
          ctest --test-dir build-relocated-cnet -C Release --output-on-failure --no-tests=error
          python3 tools/audit_runtime_owner.py --prefix "$relocated" \
            --build-dir build-relocated-cnet --report build/abi-relocation-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-relocation-linux
          path: build/abi-relocation-linux.json
          if-no-files-found: ignore
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

  macos-cnet:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    name: macOS pinned CNet provider + live TLS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VCPKG_MANIFEST_FEATURES: cnet
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact re2c from shared vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
      - name: Install pinned provider build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for formula in ninja nasm pkgconf autoconf automake libtool; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
      - name: Restore immutable vcpkg ABI packages (curl-only)
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          mode: read
          triplet: ${{ runner.arch == 'ARM64' && 'arm64-osx' || 'x64-osx' }}
          host-triplet: ${{ runner.arch == 'ARM64' && 'arm64-osx' || 'x64-osx' }}
          manifest-root: .
          features: cnet
      - name: Export exact macOS vcpkg triplet
        shell: bash
        run: echo "VCPKG_TARGET_TRIPLET=${{ runner.arch == 'ARM64' && 'arm64-osx' || 'x64-osx' }}" >> "$GITHUB_ENV"
      - name: Configure, build and execute real macOS CNet
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON -DSALTSCORE_CNET_OWNER_SOURCE_TESTS=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/saltscore-sdk"
          cmake --build build-cnet --parallel 2
          ctest --test-dir build-cnet --output-on-failure -C Release --timeout 65 --no-tests=error
          for check in saltscore.cnet_tcp_loopback saltscore.cnet_tls_ca_san \
                       saltscore.gmssl_tls_io_abi saltscore.gmssl_shangmi_provider \
                       saltscore.cnet_owner_original; do
            ctest --test-dir build-cnet -C Release --output-on-failure \
              -R "^$check$" --no-tests=error
          done
          cmake --install build-cnet --config Release
          test -f "$RUNNER_TEMP/saltscore-sdk/include/cnet/cnet.h"
          test -n "$(find "$RUNNER_TEMP/saltscore-sdk/lib" -name 'libsaltscore_cnet*.dylib' -print -quit)"
          grep -Fq 'Salts::CNet' "$RUNNER_TEMP/saltscore-sdk/lib/cmake/SaltsCore/SaltsCoreTargets.cmake"
      - name: Verify independent macOS C11/C++17 installed SDK
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/saltscore-sdk/lib:$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TARGET_TRIPLET/lib:${DYLD_LIBRARY_PATH:-}"
          cmake -S tests/installed -B build-installed-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/saltscore-sdk"
          cmake --build build-installed-cnet --parallel 2
          ctest --test-dir build-installed-cnet -C Release --output-on-failure --no-tests=error
      - name: Audit installed Mach-O exports and linked consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_audit_runtime_owner
          python3 tools/audit_runtime_owner.py \
            --prefix "$RUNNER_TEMP/saltscore-sdk" \
            --build-dir build-installed-cnet \
            --report build/abi-audit-macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-audit-macos
          path: build/abi-audit-macos.json
          if-no-files-found: ignore
      - name: Relocate installed macOS SDK and repeat C11/C++17 and ABI audit
        shell: bash
        run: |
          set -euo pipefail
          relocated="$RUNNER_TEMP/saltscore-sdk-relocated"
          test ! -e "$relocated"
          mv "$RUNNER_TEMP/saltscore-sdk" "$relocated"
          test ! -e "$RUNNER_TEMP/saltscore-sdk"
          export DYLD_LIBRARY_PATH="$relocated/lib:$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TARGET_TRIPLET/lib:${DYLD_LIBRARY_PATH:-}"
          cmake -S tests/installed -B build-relocated-cnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$relocated"
          cmake --build build-relocated-cnet --parallel 2
          ctest --test-dir build-relocated-cnet -C Release --output-on-failure --no-tests=error
          python3 tools/audit_runtime_owner.py --prefix "$relocated" \
            --build-dir build-relocated-cnet --report build/abi-relocation-macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-relocation-macos
          path: build/abi-relocation-macos.json
          if-no-files-found: ignore
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

  windows-cnet:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    name: Windows MSVC pinned CNet provider + IOCP TLS
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC for Ninja + ccache
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact re2c from shared vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable vcpkg ABI packages (curl-only)
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          mode: read
          triplet: x64-windows
          host-triplet: x64-windows
          manifest-root: .
          features: cnet
      - name: Build full pinned CNet and run real IOCP TCP/TLS tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          $cmakeArgs = @('-S', '.', '-B', 'build-cnet', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_TESTING=ON',
                    "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
                    '-DVCPKG_TARGET_TRIPLET=x64-windows',
                    '-DVCPKG_MANIFEST_FEATURES=cnet',
                    '-DSALTSCORE_BUILD_URI=ON', '-DSALTSCORE_BUILD_CNET=ON',
                    '-DSALTSCORE_BUILD_TINYTEST=ON', '-DSALTSCORE_CNET_OWNER_SOURCE_TESTS=ON',
                    "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/saltscore-sdk")
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "Windows CNet provider configure failed" }
          cmake --build build-cnet --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows CNet compilation failed" }
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/x64-windows/bin'
          $buildBin = Join-Path $env:GITHUB_WORKSPACE 'build-cnet/bin/Release'
          $env:PATH = "$vcpkgBin;$buildBin;$env:PATH"
          ctest --test-dir build-cnet -C Release --output-on-failure --timeout 65 --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows CNet native CTest failed" }
          foreach ($test in @('saltscore.cnet_tcp_loopback', 'saltscore.cnet_tls_ca_san',
                              'saltscore.gmssl_tls_io_abi', 'saltscore.gmssl_shangmi_provider',
                              'saltscore.cnet_owner_original')) {
            ctest --test-dir build-cnet -C Release --output-on-failure -R "^$test$" --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw "required Windows gate failed: $test" }
          }
          cmake --install build-cnet --config Release
          if ($LASTEXITCODE -ne 0) { throw "Windows CNet installation failed" }
      - name: Issue 64 Windows IOCP numeric-host RESOLVE-to-OPEN first-RED stress gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # TinyTest --filter selects only the original numeric 127.0.0.1
          # resolver -> IOCP connect -> OPEN case; never a fake peer or retry.
          # A failed iteration stops immediately, preserving terminal cause.
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/x64-windows/bin'
          $buildBin = Join-Path $env:GITHUB_WORKSPACE 'build-cnet/bin/Release'
          $env:PATH = "$vcpkgBin;$buildBin;$env:PATH"
          & ctest --test-dir build-cnet -C Release --output-on-failure --no-tests=error --timeout 18 -R '^saltscore[.]cnet_owner_numeric_host_gate_contract$'
          if ($LASTEXITCODE -ne 0) { throw 'Issue #64 fail-closed numeric-host selection contract failed' }
          & ctest --test-dir build-cnet -C Release --output-on-failure --no-tests=error --timeout 18 -R '^saltscore[.]cnet_owner_original_numeric_host$' --repeat until-fail:32
          if ($LASTEXITCODE -ne 0) {
            throw 'Issue #64 actual Windows IOCP numeric-host RESOLVE->OPEN RED; inspect terminal stage/status'
          }
      - name: Link and run independent MSVC C11/C++17 installed consumers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'saltscore-sdk'
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/x64-windows/bin'
          $env:PATH = "$prefix/bin;$vcpkgBin;$env:PATH"
          $cmakeArgs = @('-S', 'tests/installed', '-B', 'build-installed-cnet',
                         '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release',
                         "-DCMAKE_PREFIX_PATH=$prefix")
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "installed CNet consumer configure failed" }
          cmake --build build-installed-cnet --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "installed CNet consumer build failed" }
          ctest --test-dir build-installed-cnet -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "installed CNet consumer runtime failed" }
          if (-not (Test-Path "$prefix/include/cnet/cnet.h")) { throw "missing installed CNet header" }
          if (-not (Get-ChildItem -Path "$prefix/bin" -Filter '*saltscore_cnet*.dll')) {
            throw "missing installed CNet DLL"
          }
          if (-not (Select-String -Path "$prefix/lib/cmake/SaltsCore/SaltsCoreTargets.cmake" -SimpleMatch 'Salts::CNet' -Quiet)) {
            throw "missing installed CNet CMake target"
          }

      - name: Audit installed PE DLL exports and consumer imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest tests.test_audit_runtime_owner
          if ($LASTEXITCODE -ne 0) { throw 'ABI audit parser self-tests failed' }
          python tools/audit_runtime_owner.py --prefix "$env:RUNNER_TEMP/saltscore-sdk" --build-dir build-installed-cnet --report build/abi-audit-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'installed PE single-owner ABI audit failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-audit-windows
          path: build/abi-audit-windows.json
          if-no-files-found: ignore
      - name: Relocate installed Windows SDK and repeat C11/C++17 and ABI audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'saltscore-sdk'
          $relocated = Join-Path $env:RUNNER_TEMP 'saltscore-sdk-relocated'
          if (Test-Path $relocated) { throw 'relocated SDK prefix already exists' }
          Move-Item -Path $old -Destination $relocated
          if (Test-Path $old) { throw 'original SDK prefix must be absent' }
          $providerBin = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/x64-windows/bin'
          $env:PATH = "$relocated/bin;$providerBin;$env:PATH"
          $args = @('-S', 'tests/installed', '-B', 'build-relocated-cnet',
                    '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release',
                    "-DCMAKE_PREFIX_PATH=$relocated")
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw 'relocated SDK CMake configure failed' }
          cmake --build build-relocated-cnet --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'relocated SDK compilation failed' }
          ctest --test-dir build-relocated-cnet -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'relocated SDK CTest failed' }
          python tools/audit_runtime_owner.py --prefix $relocated --build-dir build-relocated-cnet --report build/abi-relocation-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'relocated PE owner audit failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saltscore-abi-relocation-windows
          path: build/abi-relocation-windows.json
          if-no-files-found: ignore
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

