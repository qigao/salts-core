name: CNet full original Owner Crypto DSO on Windows IOCP (test-only)

on:
  pull_request:
    paths:
      - ".github/workflows/cnet-crypto-linked-owner-windows.yml"
      - "cmake/SaltsCoreCNet.cmake"
      - "cmake/SaltsCoreCNetCryptoQualification.cmake"
      - "src/cnet/cnet_tls_crypto_qualification.c"
      - "src/cnet/cnet_tls_crypto_qualification.h"
      - "tests/cnet-crypto-owner/**"
      - "tests/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  windows-full-owner:
    name: Windows 2025 true IOCP original CNet Owner Crypto DSO
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout original CNet Owner and mutually exclusive test TLS
        uses: actions/checkout@v4
      - name: Checkout qualified single-owner Crypto CipherBIO SDK
        uses: actions/checkout@v4
        with:
          repository: qigao/crypto
          ref: 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          path: _crypto
          persist-credentials: false
      - name: Checkout immutable original GmSSL native sources
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download required Windows re2c from validated GitHub Packages via curl
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python cmake/ci/github-packages.py re2c "$env:RUNNER_TEMP/qigao-re2c-binary"
          if ($LASTEXITCODE -ne 0) { throw 'validated re2c restoration failed' }
      - name: Bootstrap canonical pinned CNet vcpkg dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cnet-full-owner-vcpkg'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          git -C $root init -q
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --no-tags origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg scripts unavailable' }
          git -C $root checkout --detach FETCH_HEAD
          git -C $root fetch --no-tags origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg baseline unavailable' }
          if ((git -C $root rev-parse HEAD).Trim() -ne '04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4') {
            throw 'unexpected vcpkg scripts commit'
          }
          git -C $root cat-file -e 'b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01:versions/baseline.json'
          if ($LASTEXITCODE -ne 0) { throw 'pinned builtin baseline missing' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
      - name: Restore original CNet Windows files-only ABI cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: saltscore-cnet-x64-windows-v8-04a9d8e5-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Verify Crypto/GmSSL immutable pinned provenance and assembly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _crypto rev-parse HEAD)" = 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          python3 _crypto/tools/verify_gmssl_import.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/crypto-source-receipt.json" \
            -P _crypto/tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/crypto-source-receipt.json"
      - name: Compile one native private GmSSL static PIC implementation
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _gmssl-upstream -B build-gmssl -G 'Visual Studio 18 2026' -A x64 \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --config Release --target gmssl --parallel 2
          test -s build-gmssl/bin/Release/gmssl.lib
      - name: Install exactly one Crypto TLS shared owner and static CipherBIO
        shell: bash
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/_m311-crypto-sdk"
          cmake -S _crypto -B build-crypto -G 'Visual Studio 18 2026' -A x64 \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl/bin/Release/gmssl.lib"
          cmake --build build-crypto --config Release --parallel 2
          cmake --install build-crypto --config Release --prefix "$sdk"
          test -s "$sdk/bin/crypto_tls.dll"
          test -s "$sdk/include/crypto/cipher_bio.h"
          test ! -e "$sdk/bin/crypto_provider.dll"
      - name: Build original CNet Owner full dependency graph with EXCLUSIVE Crypto TLS test DSO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/build/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-cnet-linked -G 'Visual Studio 18 2026' -A x64 \
            -DBUILD_TESTING=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON \
            -DSALTSCORE_CNET_BUILD_CRYPTO_TEST_DSO=ON \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/_m311-crypto-sdk" \
            "-DSALTSCORE_CRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/_crypto/providers/gmssl/tests/fixtures"
          cmake --build build-cnet-linked --config Release \
            --target saltscore_cnet_crypto_qualification \
                     saltscore_cnet_crypto_linked_owner_loopback \
                     saltscore_cnet_crypto_original_owner_tls \
                     saltscore_cnet_tcp_loopback_test --parallel 2
      - name: Windows true IOCP full Owner app, incumbent and Crypto in SEPARATE processes
        shell: bash
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/_m311-crypto-sdk"
          export PATH="$sdk/bin:$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/bin:$GITHUB_WORKSPACE/build-cnet-linked/bin/Release:$GITHUB_WORKSPACE/build-cnet-linked/Release:$PATH"
          for testname in saltscore.cnet_tcp_loopback \
                          saltscore.cnet_crypto_linked_owner_tcp_loopback \
                          saltscore.cnet_crypto_original_owner_tls12_tls13; do
            test "$(ctest --test-dir build-cnet-linked -C Release -N -R "^$testname$" |
              sed -n 's/^Total Tests: //p')" = 1
            ctest --test-dir build-cnet-linked -C Release --output-on-failure \
              -R "^$testname$" --no-tests=error --timeout 100 \
              --repeat until-fail:3
          done
      - name: Fail closed on Windows PE imports of incumbent CNet and second GmSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere required for PE evidence' }
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'MSVC instance missing' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'MSVC dumpbin required, no audit fallback' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build-cnet-linked'
          $dlls = @(Get-ChildItem -Path $dir -Recurse -File -Filter 'saltscore_cnet_crypto_qualification.dll')
          $apps = @(Get-ChildItem -Path $dir -Recurse -File -Filter 'saltscore_cnet_crypto_original_owner_tls.exe')
          if ($dlls.Count -ne 1 -or $apps.Count -ne 1) {
            throw "Expected exactly one candidate DLL and one app, got $($dlls.Count) / $($apps.Count)"
          }
          $receipt = Join-Path $env:RUNNER_TEMP 'm311-original-owner-pe-deps.txt'
          '' | Set-Content -Path $receipt
          foreach ($entry in @($dlls[0].FullName, $apps[0].FullName)) {
            "=== $entry ===" | Add-Content -Path $receipt
            $imports = (& $dumpbin.FullName /DEPENDENTS $entry | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $entry" }
            $imports | Add-Content -Path $receipt
            foreach ($needed in @('crypto_tls[.]dll', 'saltscore_core-.*[.]dll')) {
              if ($imports -notmatch "(?i)$needed") { throw "Missing one shared owner $needed in $entry" }
            }
            if ($imports -match '(?i)gmssl[.]dll|crypto_provider[.]dll|saltscore_cnet-[0-9].*[.]dll') {
              throw "Duplicate provider / incumbent CNet imported into candidate: $entry"
            }
          }
          $symbols = (& $dumpbin.FullName /EXPORTS $dlls[0].FullName | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Candidate PE export check unavailable' }
          foreach ($name in @('cnet_owner_init', 'cnet_tls_handshake', 'cnet_client_init')) {
            if ($symbols -notmatch "\b$name\b") { throw "Original CNet Owner API $name missing from Windows candidate" }
          }
          Write-Host 'One original CNet Owner DSO, one Crypto shared GmSSL and one shared Core runtime'
      - name: Upload exact-source, real IOCP CNet application and native PE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-linked-crypto-owner-windows
          path: |
            ${{ runner.temp }}/crypto-source-receipt.json
            ${{ runner.temp }}/m311-original-owner-pe-deps.txt
            build-cnet-linked/Testing/Temporary/LastTest.log
            build-cnet-linked/CMakeCache.txt
          if-no-files-found: warn
