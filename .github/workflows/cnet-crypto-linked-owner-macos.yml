name: CNet original Owner linked to opaque Crypto TLS (test-only, macOS)

on:
  pull_request:
    paths:
      - ".github/workflows/cnet-crypto-linked-owner-macos.yml"
      - "cmake/SaltsCoreCNet.cmake"
      - "cmake/SaltsCoreCNetCryptoQualification.cmake"
      - "tests/cnet-crypto-owner/**"
      - "tests/CMakeLists.txt"
      - "src/cnet/cnet_tls_crypto_qualification.c"
      - "src/cnet/cnet_tls_crypto_qualification.h"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  macos-linked-owner:
    name: macOS 15 arm64 real original CNet Owner / Crypto TLS kqueue
    runs-on: macos-15
    timeout-minutes: 75
    env:
      VCPKG_MANIFEST_FEATURES: cnet
    steps:
      - name: Checkout exact CNet original Owner candidate
        uses: actions/checkout@v4
      - name: Checkout pinned independent Crypto single owner / CipherBIO
        uses: actions/checkout@v4
        with:
          repository: qigao/crypto
          ref: 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          path: _crypto
          persist-credentials: false
      - name: Checkout immutable GmSSL original source
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Install real original CNet build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for formula in ninja re2c nasm pkgconf autoconf automake libtool; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          case "$(uname -m)" in
            arm64) triplet=arm64-osx ;;
            x86_64) triplet=x64-osx ;;
            *) echo "Unsupported macOS NativeIO owner CPU" >&2; exit 1 ;;
          esac
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> "$GITHUB_ENV"
      - name: Bootstrap pinned original CNet provider graph (no Mono/NuGet)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cnet-linked-owner-vcpkg"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --no-tags origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" checkout --detach FETCH_HEAD
          git -C "$root" fetch --no-tags origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          test "$(git -C "$root" rev-parse HEAD)" = 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" cat-file -e 'b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01:versions/baseline.json'
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Restore native macOS files-only CNet dependency cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: saltscore-cnet-macos-v8-04a9d8e5-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Verify one pinned GmSSL PIC owner and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _crypto rev-parse HEAD)" = 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          python3 _crypto/tools/verify_gmssl_import.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/crypto-source-receipt.json" \
            -P _crypto/tools/assemble_gmssl.cmake
          cmake -S _gmssl-upstream -B build-gmssl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --target gmssl --parallel 2
          test -s build-gmssl/bin/libgmssl.a
      - name: Install exactly one shared Crypto TLS and static host CipherBIO
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/crypto-linked-owner-sdk"
          cmake -S _crypto -B build-crypto -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl/bin/libgmssl.a"
          cmake --build build-crypto --parallel 2
          cmake --install build-crypto --prefix "$sdk"
          test -s "$sdk/lib/libcrypto_tls.dylib"
          test -s "$sdk/include/crypto/cipher_bio.h"
          test ! -e "$sdk/lib/libcrypto_provider.dylib"
      - name: Build full original CNet Owner and mutually exclusive Crypto TLS DSO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/build/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-cnet-linked -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON \
            -DSALTSCORE_CNET_BUILD_CRYPTO_TEST_DSO=ON \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-linked-owner-sdk" \
            "-DSALTSCORE_CRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/_crypto/providers/gmssl/tests/fixtures"
          cmake --build build-cnet-linked \
            --target saltscore_cnet_crypto_qualification \
                     saltscore_cnet_crypto_linked_owner_loopback \
                     saltscore_cnet_crypto_original_owner_tls \
                     saltscore_cnet_tcp_loopback_test --parallel 2
      - name: Run incumbent and original CNet Owner plus Crypto DSO in separate processes
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/crypto-linked-owner-sdk/lib:$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TARGET_TRIPLET/lib:${DYLD_LIBRARY_PATH:-}"
          for testname in saltscore.cnet_tcp_loopback \
                          saltscore.cnet_crypto_linked_owner_tcp_loopback \
                          saltscore.cnet_crypto_original_owner_tls12_tls13; do
            ctest --test-dir build-cnet-linked --output-on-failure \
              -R "^$testname$" --no-tests=error --timeout 100 --repeat until-fail:3
          done
      - name: Audit real Mach-O closure — one Crypto owner, one Core runtime
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/build-cnet-linked/libsaltscore_cnet_crypto_qualification.dylib"
          test -s "$candidate"
          otool -L "$candidate" | tee "$RUNNER_TEMP/cnet-crypto-linked-imports.txt"
          grep -q 'libcrypto_tls' "$RUNNER_TEMP/cnet-crypto-linked-imports.txt"
          grep -q 'libsaltscore_core' "$RUNNER_TEMP/cnet-crypto-linked-imports.txt"
          if grep -Ei 'libgmssl[.]|libcrypto_provider|libsaltscore_cnet-[0-9]' \
              "$RUNNER_TEMP/cnet-crypto-linked-imports.txt"; then
            echo "DUPLICATE GmSSL / CNet image in candidate owner" >&2
            exit 1
          fi
          # Materialize the COMPLETE Mach-O export table first.
          # nm | grep -q triggers SIGPIPE/LLVM abort under bash pipefail:
          # an audit-script failure, not a native CNet/TLS defect.
          nm -gU "$candidate" > "$RUNNER_TEMP/cnet-crypto-linked-exports.txt"
          test -s "$RUNNER_TEMP/cnet-crypto-linked-exports.txt"
          for symbol in _cnet_owner_init _cnet_tls_handshake _cnet_client_init; do
            grep -Eq " $symbol$" "$RUNNER_TEMP/cnet-crypto-linked-exports.txt" || {
              echo "Missing required ORIGINAL CNet Owner export: $symbol" >&2
              exit 1
            }
          done
          candidate_app="$GITHUB_WORKSPACE/build-cnet-linked/saltscore_cnet_crypto_original_owner_tls"
          test -x "$candidate_app"
          otool -L "$candidate_app" > "$RUNNER_TEMP/cnet-crypto-linked-app-imports.txt"
          grep -q 'libsaltscore_cnet_crypto_qualification' "$RUNNER_TEMP/cnet-crypto-linked-app-imports.txt"
          if grep -Eiq 'libgmssl[.]|libcrypto_provider|libsaltscore_cnet-[0-9]' \
              "$RUNNER_TEMP/cnet-crypto-linked-app-imports.txt"; then
            echo "ALTERNATE CNet app imported incumbent/provider duplicate" >&2
            exit 1
          fi
      - name: Store native linking, source and separate-app evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-linked-crypto-owner-macos
          path: |
            ${{ runner.temp }}/crypto-source-receipt.json
            ${{ runner.temp }}/cnet-crypto-linked-imports.txt
            ${{ runner.temp }}/cnet-crypto-linked-exports.txt
            ${{ runner.temp }}/cnet-crypto-linked-app-imports.txt
            build-cnet-linked/Testing/Temporary/LastTest.log
            build-cnet-linked/CMakeCache.txt
          if-no-files-found: warn
