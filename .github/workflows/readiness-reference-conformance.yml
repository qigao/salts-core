name: Exact original Salts Readiness tests on installed Core

on:
  pull_request:
    paths:
      - ".github/actions/setup-ccache/**"
      - ".github/workflows/readiness-reference-conformance.yml"
      - "tests/readiness-reference/**"
      - "platform/src/readiness*"
      - "platform/include/salts/readiness.h"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saltscore-fifo-workflows
  cancel-in-progress: false
  queue: max

jobs:
  original-readiness:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    name: ${{ matrix.os }} original Readiness epoll=${{ matrix.epoll }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            epoll: OFF
          - os: ubuntu-24.04
            epoll: ON
          - os: macos-15
            epoll: OFF
          - os: windows-2025
            epoll: OFF

    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC for Ninja + ccache
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned original Salts test sources
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: df4c697d2f1facb6b54a3568520dd743c628aa81
          path: salts-readiness-reference
          persist-credentials: false
      - name: Build and install one shared native Platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C salts-readiness-reference rev-parse HEAD)" = \
            df4c697d2f1facb6b54a3568520dd743c628aa81
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G Ninja)
          else
            generator=(-G Ninja)
          fi
          prefix="$RUNNER_TEMP/saltscore-readiness-sdk"
          cmake -S . -B build-readiness-owner "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            "-DSALTSCORE_ENABLE_EPOLL_READINESS=${{ matrix.epoll }}" \
            "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build build-readiness-owner --config Release --parallel 2
          cmake --install build-readiness-owner --config Release
      - name: Compile and run original state/fault/native backend contracts
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/saltscore-readiness-sdk"
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G Ninja)
            export PATH="$(cygpath -u "$prefix")/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            generator=(-G Ninja)
            export DYLD_LIBRARY_PATH="$prefix/lib:${DYLD_LIBRARY_PATH:-}"
          else
            generator=(-G Ninja)
            export LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S tests/readiness-reference -B build-readiness-contract \
            "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
            "-DSALTS_REFERENCE_SOURCE_ROOT=$GITHUB_WORKSPACE/salts-readiness-reference" \
            "-DSALTSCORE_ENABLE_EPOLL_READINESS=${{ matrix.epoll }}" \
            "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build-readiness-contract --config Release --parallel 2
          ctest --test-dir build-readiness-contract -C Release \
            --output-on-failure --no-tests=error --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-readiness-${{ matrix.os }}-epoll-${{ matrix.epoll }}
          path: build-readiness-contract/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

