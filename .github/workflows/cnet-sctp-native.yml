name: SaltsCore C11 SCTP native owner and standalone installed SDK
on:
  pull_request:
    paths:
      - ".github/actions/setup-ccache/**"
      - "sctp/**"
      - "CMakeLists.txt"
      - "tools/audit_cnet_sctp_source.py"
      - "tools/check_dependency_boundaries.py"
      - ".github/workflows/cnet-sctp-native.yml"
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup-ccache/**"
      - "sctp/**"
      - "CMakeLists.txt"
      - "tools/audit_cnet_sctp_source.py"
      - ".github/workflows/cnet-sctp-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saltscore-fifo-workflows
  cancel-in-progress: false
  queue: max

jobs:
  sctp-native:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    name: "SCTP C11 source and installed Salts::SCTP / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable MSVC for Ninja + ccache
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original source hashes and strict single-owner boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_cnet_sctp_source.py
          python3 tools/check_dependency_boundaries.py
          python3 -m unittest discover -s tests -p 'test_dependency_boundaries.py'
      - name: Full native C11 SCTP association and CNet conformance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G Ninja)
            threads=OFF
          else
            gen=(-G Ninja)
            threads=ON
          fi
          cmake -S . -B build-sctp "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DSALTSCORE_BUILD_SCTP=ON \
            "-DCNET_SCTP_TEST_OWNER_THREADS=$threads" \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/core-sctp-sdk"
          cmake --build build-sctp --config Release --parallel 2
          ctest --test-dir build-sctp -C Release --no-tests=error \
            --output-on-failure --timeout 120
          cmake --install build-sctp --config Release
      - name: Independent installed C11 opaque Session consumer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G Ninja)
            export PATH="$(cygpath -u "$RUNNER_TEMP")/core-sctp-sdk/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            gen=(-G Ninja)
            export DYLD_LIBRARY_PATH="$RUNNER_TEMP/core-sctp-sdk/lib:${DYLD_LIBRARY_PATH:-}"
          else
            gen=(-G Ninja)
            export LD_LIBRARY_PATH="$RUNNER_TEMP/core-sctp-sdk/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S sctp/tests/installed -B build-installed "${gen[@]}" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/core-sctp-sdk" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-installed --config Release --parallel 2
          ctest --test-dir build-installed -C Release --no-tests=error \
            --output-on-failure --timeout 120
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saltscore-sctp-native-${{ matrix.os }}
          path: |
            build-sctp/Testing/Temporary/LastTest.log
            build-installed/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

