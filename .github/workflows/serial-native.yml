name: SaltsCore native Serial source and installed ABI

on:
  pull_request:
    paths:
      - "salts_serial/**"
      - "platform/**"
      - "concurrency/**"
      - "core/**"
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "tools/check_dependency_boundaries.py"
      - "tools/check_module_layout.py"
      - "tools/migration/**"
      - ".github/workflows/serial-native.yml"
      - ".github/actions/setup-core-native/**"
      - "crypto/native/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-serial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Preserve source-lock Git blob bytes from the initial checkout.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  serial:
    name: "Serial owner and SDK / ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            flags: ""
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - os: ubuntu-24.04
            profile: linux-tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - os: windows-2025
            profile: windows-release
            flags: ""
          - os: macos-15
            profile: macos-release
            flags: ""
    env:
      SERIAL_FLAGS: ${{ matrix.flags }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verified compiler output cache
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-serial-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Frozen sources, complete API and dependency direction
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dependency_boundaries.py
          python tools/check_module_layout.py
          python tools/check_full_source_migration.py
          python -m unittest discover -s salts_serial/test -p test_serial_provenance.py -v
      - name: Restore exact prerequisites for the default local Crypto and CNet graph
        uses: ./.github/actions/setup-core-native
        with:
          dependency-mode: source
          token: ${{ github.token }}
      - name: Build the complete configured graph and all retained examples
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$SERIAL_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$SERIAL_FLAGS" "-DCMAKE_CXX_FLAGS=$SERIAL_FLAGS")
            args+=("-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG")
          fi
          cmake -S . "-DCMAKE_TOOLCHAIN_FILE=$CORE_CI_TOOLCHAIN" "-DVCPKG_TARGET_TRIPLET=$CORE_CI_TRIPLET" "-DVCPKG_HOST_TRIPLET=$CORE_CI_HOST_TRIPLET" -B build-serial -G Ninja \
            -DBUILD_TESTING=ON -DSALTSCORE_BUILD_SERIAL=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON -DSALTSCORE_BUILD_SERIAL_EXAMPLES=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/serial-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-serial --config Release --parallel 2
      - name: Original assertions, owned snapshots and native PTY behavior
        shell: bash
        run: |
          set -euo pipefail
          cases=(original_c11 public_abi original_fixes backend_contract storage_ownership source_provenance)
          if [[ "$RUNNER_OS" != Windows ]]; then cases+=(posix_pty); fi
          for case in "${cases[@]}"; do
            ctest --test-dir build-serial -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^saltscore[.]serial_${case}$"
          done
          cmake --install build-serial --config Release
      - name: Build and run independent installed C11 and C++17 consumers
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$SERIAL_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$SERIAL_FLAGS" "-DCMAKE_CXX_FLAGS=$SERIAL_FLAGS")
            args+=("-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG")
          fi
          case "$RUNNER_OS" in
            Windows) export PATH="$(cygpath -u "$RUNNER_TEMP")/serial-sdk/bin:$PATH" ;;
            macOS) export DYLD_LIBRARY_PATH="$RUNNER_TEMP/serial-sdk/lib:${DYLD_LIBRARY_PATH:-}" ;;
            Linux) export LD_LIBRARY_PATH="$RUNNER_TEMP/serial-sdk/lib:${LD_LIBRARY_PATH:-}" ;;
          esac
          cmake -S salts_serial/test/installed -B build-serial-installed -G Ninja \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/serial-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-serial-installed --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir build-serial-installed -C Release --output-on-failure \
              --no-tests=error --timeout 60 -R "^sdk[.]serial_${lang}$"
          done
      - name: Record exact revision and pending physical-device coverage
        shell: bash
        env:
          SERIAL_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          result = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "profile": os.environ["SERIAL_PROFILE"],
              "source_donor": "5b0be65de673261fc37b29485b0364ca38cc6cd6",
              "retained_source_files": 20,
              "public_functions": 30,
              "original_injected_backend_cases": 7 if os.environ["RUNNER_OS"] == "Windows" else 6,
              "posix_pty": "passed" if os.environ["RUNNER_OS"] != "Windows" else "not a Windows backend test",
              "physical_serial_device": "pending; PTY and injected backend are not physical serial hardware",
              "global_migration_complete": False,
          }
          Path("build-serial/serial-qualification.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-serial/Testing/Temporary/LastTest.log
            build-serial/CMakeCache.txt
            build-serial/serial-qualification.json
            build-serial-installed/Testing/Temporary/LastTest.log
          if-no-files-found: error
