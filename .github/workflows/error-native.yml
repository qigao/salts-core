name: SaltsCore original native error owner

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "core/CMakeLists.txt"
      - "core/include/cmeta_api.h"
      - "core/include/cmeta_error.h"
      - "core/src/cmeta_error.c"
      - "platform/**"
      - "tests/CMakeLists.txt"
      - "tests/test_cmeta_error.c"
      - "tests/error_native_contract.c"
      - "tests/test_original_error_provenance.py"
      - "tests/installed/**"
      - "tools/migration/original-*.json"
      - ".github/workflows/error-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saltscore-error-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  error:
    name: "Error owner ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            flags: ""
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - os: ubuntu-24.04
            profile: linux-tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - os: windows-2025
            profile: windows-release
            flags: ""
          - os: macos-15
            profile: macos-release
            flags: ""
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      ERROR_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-error-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure and build the complete native graph
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$ERROR_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$ERROR_FLAGS" "-DCMAKE_CXX_FLAGS=$ERROR_FLAGS")
          fi
          cmake -S . -B build-error -G Ninja \
            -DBUILD_TESTING=ON -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/error-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-error --config Release --parallel 2
      - name: Run original cases, independent native contracts and source gates
        shell: bash
        run: |
          set -euo pipefail
          for case in original_error error_native_contract original_error_source_provenance \
                      all_original_source_provenance all_original_source_negative; do
            ctest --test-dir build-error -C Release --output-on-failure \
              --no-tests=error --timeout 120 --output-junit "$case.xml" \
              -R "^saltscore[.]${case}$"
          done
          cmake --install build-error --config Release
      - name: Build and execute independent installed C11 and C++17 clients
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$ERROR_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$ERROR_FLAGS" "-DCMAKE_CXX_FLAGS=$ERROR_FLAGS")
          fi
          case "$RUNNER_OS" in
            Windows) export PATH="$(cygpath -u "$RUNNER_TEMP")/error-sdk/bin:$PATH" ;;
            macOS) export DYLD_LIBRARY_PATH="$RUNNER_TEMP/error-sdk/lib:${DYLD_LIBRARY_PATH:-}" ;;
            Linux) export LD_LIBRARY_PATH="$RUNNER_TEMP/error-sdk/lib:${LD_LIBRARY_PATH:-}" ;;
          esac
          cmake -S tests/installed -B build-error-installed -G Ninja \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/error-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-error-installed --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir build-error-installed -C Release --output-on-failure \
              --no-tests=error --timeout 120 --output-junit "error-$lang.xml" \
              -R "^sdk[.]error_${lang}$"
          done
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: error-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-error/Testing/Temporary/LastTest.log
            build-error/*.xml
            build-error-installed/Testing/Temporary/LastTest.log
            build-error-installed/*.xml
          if-no-files-found: error
