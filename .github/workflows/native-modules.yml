name: SaltsCore Unicode17 IDNA CSerde TinyTest native conformance

on:
  push:
    paths:
      - "unicode/**"
      - "idna/**"
      - "cserde/**"
      - "tinytest/**"
      - "include/vstr.h"
      - "cmake/SaltsCoreExtraModules.cmake"
      - "tests/native-modules/**"
      - "tests/installed/**"
      - ".github/workflows/native-modules.yml"
  pull_request:
    paths:
      - "unicode/**"
      - "idna/**"
      - "cserde/**"
      - "tinytest/**"
      - "include/vstr.h"
      - "cmake/SaltsCoreExtraModules.cmake"
      - "tests/native-modules/**"
      - "tests/installed/**"
      - ".github/workflows/native-modules.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: read

jobs:
  original-native:
    name: "Core-only native source + installed C11/C++17 / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact re2c 4.6 Unicode 17 host generator and data
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@2e214ae44a3e3244eded5db6361194576356fc9e
        with:
          token: ${{ github.token }}
      - name: Build original source under sole SaltsCore targets, test and install
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_dependency_boundaries.py
          python3 -m unittest discover -s tests -p 'test_dependency_boundaries.py'
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
          else
            gen=(-G Ninja)
          fi
          test -d "$RE2C_ROOT/share/re2c/stdlib"
          "$RE2C_ROOT/bin/re2c" --version || "$RE2C_ROOT/bin/re2c.exe" --version
          cmake -S . -B build-native "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DSALTSCORE_BUILD_TINYTEST=ON \
            -DSALTSCORE_BUILD_CSERDE=ON \
            -DSALTSCORE_BUILD_UNICODE=ON \
            -DSALTSCORE_BUILD_IDNA=ON \
            -DSALTSCORE_NATIVE_CPP_CONFORMANCE=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/core-native-sdk"
          cmake --build build-native --config Release --parallel 2
          ctest --test-dir build-native -C Release --no-tests=error \
            --output-on-failure --timeout 300
          cmake --install build-native --config Release
      - name: Separate installed C11 and C++17 target and ownership audits
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
            export PATH="$(cygpath -u "$RUNNER_TEMP")/core-native-sdk/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            gen=(-G Ninja)
            export DYLD_LIBRARY_PATH="$RUNNER_TEMP/core-native-sdk/lib:${DYLD_LIBRARY_PATH:-}"
          else
            gen=(-G Ninja)
            export LD_LIBRARY_PATH="$RUNNER_TEMP/core-native-sdk/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S tests/installed -B build-native-installed "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/core-native-sdk"
          cmake --build build-native-installed --config Release --parallel 2
          ctest --test-dir build-native-installed -C Release --no-tests=error \
            --output-on-failure --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-native-conformance-${{ matrix.os }}
          path: |
            build-native/Testing/Temporary/LastTest.log
            build-native-installed/Testing/Temporary/LastTest.log
          if-no-files-found: warn
