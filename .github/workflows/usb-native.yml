name: SaltsCore native USB source and installed ABI

on:
  pull_request:
    paths:
      - "usb/**"
      - "platform/**"
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "tools/check_dependency_boundaries.py"
      - "tools/check_module_layout.py"
      - "tools/check_full_source_migration.py"
      - "tools/migration/**"
      - ".github/workflows/usb-native.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-usb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  usb:
    name: "USB owner and SDK / ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            triplet: x64-linux
            sanitize: false
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            triplet: x64-linux
            sanitize: true
          - os: windows-2025
            profile: windows-release
            triplet: qigao-x64-windows-v145
            sanitize: false
          - os: macos-15
            profile: macos-release
            triplet: arm64-osx
            sanitize: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Native libusb Linux system dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Verified compiler output cache
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-usb-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical libusb provider from the pinned vcpkg cache
        id: cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.triplet }}
          features: usb
      - name: Preserve frozen sources and dependency direction
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dependency_boundaries.py
          python tools/check_module_layout.py
          python tools/check_full_source_migration.py
          python -m unittest discover -s usb/tests -p test_usb_provenance.py -v
      - name: Configure and build the full native graph
        shell: bash
        env:
          USB_TOOLCHAIN: ${{ steps.cache.outputs.toolchain_file }}
          USB_SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$USB_SANITIZE" == true ]]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags")
          fi
          cmake -S . -B build-usb -G Ninja \
            -DBUILD_TESTING=ON \
            -DSALTSCORE_BUILD_USB=ON -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$USB_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_FEATURES=usb \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/usb-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-usb --config Release --parallel 2
      - name: Execute original tests and native ownership contracts
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          for case in original_c11 original_cpp17 original_state lifecycle source_provenance; do
            ctest --test-dir build-usb -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^saltscore[.]usb_${case}$"
          done
          cmake --install build-usb --config Release
      - name: Build and execute independent installed C11 and C++17 clients
        shell: bash
        env:
          USB_SANITIZE: ${{ matrix.sanitize }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$USB_SANITIZE" == true ]]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The installed SDK must carry the exact selected libusb DLL.
            # Do not add the provider's bin directory to the consumer loader path.
            usb_sdk="$(cygpath -u "$RUNNER_TEMP")/usb-sdk"
            test -f "$usb_sdk/bin/libusb-1.0.dll"
            test -f "$usb_sdk/share/licenses/SaltsCore/libusb/copyright"
            export PATH="$usb_sdk/bin:$PATH"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            export DYLD_LIBRARY_PATH="$RUNNER_TEMP/usb-sdk/lib:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$RUNNER_TEMP/usb-sdk/lib:${LD_LIBRARY_PATH:-}"
          fi
          cmake -S usb/tests/installed -B build-usb-installed -G Ninja \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/usb-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-usb-installed --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir build-usb-installed -C Release --output-on-failure \
              --no-tests=error --timeout 60 -R "^sdk[.]usb_${lang}$"
          done
      - name: Record the scope of this exact-revision qualification
        shell: bash
        env:
          USB_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          result = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "profile": os.environ["USB_PROFILE"],
              "source_donor": "5b0be65de673261fc37b29485b0364ca38cc6cd6",
              "retained_source_files": 10,
              "public_functions": 13,
              "real_provider": "libusb-1.0 from the repository's pinned vcpkg baseline",
              "qualified_here": ["real context initialization and enumeration", "deterministic original source state machine", "installed C11 and C++17 ABI"],
              "physical_device_transfers": "pending; no attached USB fixture in this workflow",
              "physical_hotplug": "pending; deterministic event injection is not hardware qualification",
              "global_migration_complete": False,
          }
          Path("build-usb/usb-qualification.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Record compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usb-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-usb/Testing/Temporary/LastTest.log
            build-usb/CMakeCache.txt
            build-usb/usb-qualification.json
            build-usb-installed/Testing/Temporary/LastTest.log
          if-no-files-found: warn
