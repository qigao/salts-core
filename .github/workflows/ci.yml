name: SaltsCore LLVM CI

on:
  pull_request:
    paths:
      - "platform/src/**"
      - "platform/include/**"
      - "core/src/**"
      - "core/include/**"
      - "core/parser/**"
      - "asn1/src/**"
      - "asn1/include/**"
      - "crypto/src/**"
      - "crypto/include/**"
      - "crypto/native/gmssl/src/**"
      - "crypto/native/gmssl/include/**"
      - "concurrency/src/**"
      - "concurrency/include/**"
      - "coroutine/src/**"
      - "coroutine/include/**"
      - "native-io/src/**"
      - "native-io/include/**"
      - "uri/src/**"
      - "uri/include/**"
      - "uri/parser/**"
      - "cnet/src/**"
      - "cnet/include/**"
      - "cserde/src/**"
      - "cserde/include/**"
      - "tinytest/src/**"
      - "tinytest/include/**"
      - "unicode/src/**"
      - "unicode/include/**"
      - "unicode/data/**"
      - "idna/src/**"
      - "idna/include/**"
      - "fs/src/**"
      - "fs/include/**"
      - "process/src/**"
      - "process/include/**"
      - "sctp/src/**"
      - "sctp/include/**"
      - "usb/src/**"
      - "usb/include/**"
      - "playback/src/**"
      - "playback/include/**"
      - "capture/src/**"
      - "capture/include/**"
      - "serial/*.c"
      - "serial/*.h"
      - "verification/*.pml"
      - "vendor/cnet/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - "**/tests/**"
      - "tinytest/test/**"
  push:
    branches: [master]
    tags: ["v0.1.002"]
    paths:
      - "platform/src/**"
      - "platform/include/**"
      - "core/src/**"
      - "core/include/**"
      - "core/parser/**"
      - "asn1/src/**"
      - "asn1/include/**"
      - "crypto/src/**"
      - "crypto/include/**"
      - "crypto/native/gmssl/src/**"
      - "crypto/native/gmssl/include/**"
      - "concurrency/src/**"
      - "concurrency/include/**"
      - "coroutine/src/**"
      - "coroutine/include/**"
      - "native-io/src/**"
      - "native-io/include/**"
      - "uri/src/**"
      - "uri/include/**"
      - "uri/parser/**"
      - "cnet/src/**"
      - "cnet/include/**"
      - "cserde/src/**"
      - "cserde/include/**"
      - "tinytest/src/**"
      - "tinytest/include/**"
      - "unicode/src/**"
      - "unicode/include/**"
      - "unicode/data/**"
      - "idna/src/**"
      - "idna/include/**"
      - "fs/src/**"
      - "fs/include/**"
      - "process/src/**"
      - "process/include/**"
      - "sctp/src/**"
      - "sctp/include/**"
      - "usb/src/**"
      - "usb/include/**"
      - "playback/src/**"
      - "playback/include/**"
      - "capture/src/**"
      - "capture/include/**"
      - "serial/*.c"
      - "serial/*.h"
      - "verification/*.pml"
      - "vendor/cnet/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - "**/tests/**"
      - "tinytest/test/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: LLVM / ${{ matrix.rid }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: linux-x64, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: ci-native, android_abi: "", package: true}
          - {rid: linux-arm64, runner: ubuntu-24.04-arm, target: arm64, triplet: arm64-linux, host: arm64-linux, preset: ci-native, android_abi: "", package: true}
          - {rid: macos-x64, runner: macos-15-intel, target: x64, triplet: x64-osx, host: x64-osx, preset: ci-native, android_abi: "", package: true}
          - {rid: macos-arm64, runner: macos-15, target: arm64, triplet: arm64-osx, host: arm64-osx, preset: ci-native, android_abi: "", package: true}
          - {rid: windows-x64, runner: windows-2025, target: x64, triplet: qigao-x64-windows-llvm-mingw, host: qigao-x64-windows-llvm-mingw, preset: ci-native, android_abi: "", package: true}
          - {rid: windows-arm64, runner: windows-11-arm, target: arm64, triplet: qigao-arm64-windows-llvm-mingw, host: qigao-arm64-windows-llvm-mingw, preset: ci-native, android_abi: "", package: true}
          - {rid: linux-x64-asan-ubsan, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: ci-asan-ubsan, android_abi: "", package: false}
          - {rid: linux-x64-tsan, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: ci-tsan, android_abi: "", package: false}
          - {rid: android-x64, runner: ubuntu-24.04, target: x64, triplet: x64-android, host: x64-linux, preset: ci-android, android_abi: x86_64, package: true}
          - {rid: android-arm64, runner: ubuntu-24.04, target: arm64, triplet: arm64-android, host: x64-linux, preset: ci-android, android_abi: arm64-v8a, package: true}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up native LLVM
        if: runner.os != 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@529019437597fa71f7d8dcc561d26fc7b0603ae6
        with:
          build-type: toolchain-only
          obfuscator: "false"

      - name: Set up Windows LLVM-MinGW
        if: runner.os == 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@529019437597fa71f7d8dcc561d26fc7b0603ae6
        with:
          target: ${{ matrix.target }}
          build-type: toolchain-only
          obfuscator: "false"

      - name: Set up shared dependency contract
        id: vcpkg
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@529019437597fa71f7d8dcc561d26fc7b0603ae6
        with:
          mode: read
          token: ${{ github.token }}

      - name: Restore re2c and Unicode host data
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@529019437597fa71f7d8dcc561d26fc7b0603ae6
        with:
          token: ${{ github.token }}

      - name: Install macOS native autotools
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install automake libtool

      - name: Install Linux native capture SDK headers
        if: runner.os == 'Linux' && matrix.preset != 'ci-android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libpipewire-0.3-dev libx11-dev libxext-dev
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          system_pkg_config_path="/usr/lib/$multiarch/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
          if [[ -n "${PKG_CONFIG_PATH:-}" ]]; then
            system_pkg_config_path="$system_pkg_config_path:$PKG_CONFIG_PATH"
          fi
          echo "PKG_CONFIG_PATH=$system_pkg_config_path" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$system_pkg_config_path" pkg-config --exists libpipewire-0.3

      - name: Select preset toolchains
        shell: bash
        env:
          VCPKG_TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain_file }}
          RID: ${{ matrix.rid }}
          TARGET_TRIPLET: ${{ matrix.triplet }}
          HOST_TRIPLET: ${{ matrix.host }}
          ANDROID_ABI: ${{ matrix.android_abi }}
        run: |
          set -euo pipefail
          test -n "$VCPKG_TOOLCHAIN"
          if [[ "$RID" == android-* ]]; then
            chainload="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
            test -f "$chainload"
          else
            chainload="$QIGAO_COMPILER_TOOLCHAIN_FILE"
            test -f "$chainload"
          fi
          {
            echo "SALTSCORE_VCPKG_TOOLCHAIN_FILE=$VCPKG_TOOLCHAIN"
            echo "SALTSCORE_CHAINLOAD_TOOLCHAIN_FILE=$chainload"
            echo "SALTSCORE_VCPKG_TARGET_TRIPLET=$TARGET_TRIPLET"
            echo "SALTSCORE_VCPKG_HOST_TRIPLET=$HOST_TRIPLET"
            echo "SALTSCORE_ANDROID_ABI=$ANDROID_ABI"
            echo "SALTSCORE_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
          } >> "$GITHUB_ENV"

      - name: Configure full graph
        shell: bash
        run: |
          # Qualify real Owner handoff and genuine dlopen/dlclose in the
          # existing Linux native + TSan lanes, never an extra probe job.
          if [[ "${{ matrix.rid }}" == "linux-x64" ]]; then
            # Reuse the existing full-native lane for the actual opt-in
            # original TLS Owner and shared-DSO plugin lifecycle.
            # The pinned certificate files are already source-owned; no
            # additional installer, consumer, probe workflow or test project.
            cmake --preset "${{ matrix.preset }}" \
              -DCNET_SCTP_TEST_OWNER_THREADS=ON \
              -DSALTSCORE_TEST_CNET_CRYPTO_QUALIFICATION=ON \
              -DSALTSCORE_CNET_M6_SHARED_DSO_TEST=ON \
              "-DSALTSCORE_CRYPTO_TEST_FIXTURES=${GITHUB_WORKSPACE}/crypto/tests/fixtures"
          elif [[ "${{ matrix.rid }}" == "linux-x64-tsan" ]]; then
            cmake --preset "${{ matrix.preset }}" -DCNET_SCTP_TEST_OWNER_THREADS=ON
          else
            cmake --preset "${{ matrix.preset }}"
          fi

      - name: Build full graph
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run formal CTest suite
        if: matrix.preset != 'ci-android'
        shell: bash
        run: ctest --preset "${{ matrix.preset }}"

      - name: Install release SDK
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        shell: bash
        run: cmake --build --preset "install-${{ matrix.preset }}"

      - name: Record immutable SDK provenance
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'package/sdk/${{ matrix.rid }}'
          if (-not (Test-Path "$prefix/lib/cmake/SaltsCore/SaltsCoreConfig.cmake")) {
            throw 'SaltsCore SDK installation is missing'
          }
          @(
            'release=0.1.001'
            'package=0.1.2'
            "commit=$env:GITHUB_SHA"
            'rid=${{ matrix.rid }}'
            'profile=release'
            'compiler=llvm'
            'protection=none'
          ) | Set-Content -Encoding utf8 "$prefix/saltscore-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        with:
          name: saltscore-sdk-${{ matrix.rid }}
          path: package
          if-no-files-found: error
          retention-days: 14

  package:
    name: Publish SaltsCore.Native 0.1.2
    if: github.ref == 'refs/tags/v0.1.002'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: saltscore-sdk-*
          path: package
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack immutable eight-RID SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 v0.1.002)" = "$GITHUB_SHA"
          test "$(find package/sdk -maxdepth 2 -name saltscore-sdk-manifest.txt | wc -l)" -eq 8
          dotnet pack packaging/nuget/SaltsCore.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion=0.1.2 \
            -p:PackageRoot="$GITHUB_WORKSPACE/package"
          package=dist/SaltsCore.Native.0.1.2.nupkg
          test -f "$package"
          sha256sum "$package" > dist/SHA256SUMS
      - name: Refuse an existing release or normalized package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.002 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub Release v0.1.002 already exists' >&2
            exit 1
          fi
          inventory="$RUNNER_TEMP/saltscore-packages.json"
          error="$RUNNER_TEMP/saltscore-packages.err"
          if gh api --paginate '/users/qigao/packages/nuget/SaltsCore.Native/versions?per_page=100' > "$inventory" 2> "$error"; then
            python3 - "$inventory" <<'PY'
          import json, sys
          if any(item.get('name', '').lower() == '0.1.2' for item in json.load(open(sys.argv[1]))):
              raise SystemExit('SaltsCore.Native 0.1.2 already exists')
          PY
          elif ! grep -Fq 'HTTP 404' "$error"; then
            cat "$error" >&2
            exit 1
          fi
      - name: Publish NuGet package and GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/saltscore-release-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push dist/SaltsCore.Native.0.1.2.nupkg \
            --api-key "$GITHUB_TOKEN" --source github --configfile "$config"
          gh release create v0.1.002 \
            dist/SaltsCore.Native.0.1.2.nupkg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title 'SaltsCore 0.1.001' --generate-notes --latest

  result:
    name: CI result
    if: ${{ always() }}
    needs: [qualify, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every LLVM qualification job
        shell: bash
        run: |
          test '${{ needs.qualify.result }}' = success
          if [[ '${{ github.ref }}' == refs/tags/v0.1.002 ]]; then
            test '${{ needs.package.result }}' = success
          fi
