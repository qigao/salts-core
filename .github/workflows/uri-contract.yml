name: SaltsCore URI parser qualification

on:
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup-ccache/**"
      - "uri/src/**"
      - "uri/parser/**"
      - "uri/CMakeLists.txt"
      - "uri/include/uri_parser.h"
      - "CMakeLists.txt"
      - "tests/test_uri.c"
      - "tests/installed/uri_consumer.*"
      - "tests/installed/CMakeLists.txt"
      - ".github/workflows/uri-contract.yml"
  pull_request:
    paths:
      - ".github/actions/setup-ccache/**"
      - "uri/src/**"
      - "uri/parser/**"
      - "uri/CMakeLists.txt"
      - "uri/include/uri_parser.h"
      - "CMakeLists.txt"
      - "tests/test_uri.c"
      - "tests/installed/uri_consumer.*"
      - "tests/installed/CMakeLists.txt"
      - ".github/workflows/uri-contract.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-fifo-workflows
  cancel-in-progress: false
  queue: max

jobs:
  uri:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned re2c from qigao/vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
      - name: Configure, build and test generated URI parser
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_dependency_boundaries.py
          cmake -S . -B build-uri -DBUILD_TESTING=ON -DSALTSCORE_BUILD_URI=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/uri-sdk"
          cmake --build build-uri --config Release --parallel 2
          ctest --test-dir build-uri -C Release --output-on-failure
          cmake --install build-uri --config Release
      - name: Installed standalone URI C11 and C++17 consumers
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/uri-sdk/lib:${LD_LIBRARY_PATH:-}"
          cmake -S tests/installed -B build-uri-consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/uri-sdk"
          cmake --build build-uri-consumer --config Release --parallel 2
          ctest --test-dir build-uri-consumer -C Release --output-on-failure
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats

