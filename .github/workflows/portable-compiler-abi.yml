name: TinyCC llvm-mingw ABI

on:
  pull_request:
    paths:
      - "platform/**"
      - "tests/portable_tcc_windows_client.c"
      - "tests/portable_tcc_tss_windows.c"
      - "tests/test_c11_threads.c"
      - ".github/workflows/portable-compiler-abi.yml"
  push:
    branches: [master]
    paths:
      - "platform/**"
      - "tests/portable_tcc_windows_client.c"
      - "tests/portable_tcc_tss_windows.c"
      - "tests/test_c11_threads.c"
      - ".github/workflows/portable-compiler-abi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-compiler-abi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore pinned llvm-mingw
        id: llvm
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@29317e280bc398ef8b574d2017b4851bfdad3894
        with:
          target: x64
          build-type: toolchain-only
          verify-smoke: "false"

      - name: Restore pinned TinyCC-builder
        id: tiny
        uses: qigao/vcpkg-cache/.github/actions/setup-tinycc-builder@29317e280bc398ef8b574d2017b4851bfdad3894
        with:
          target: x64
          build-type: toolchain-only
          verify-smoke: "false"

      - name: Build provider DLLs and run each native TinyCC client once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-portable | Out-Null
          $llvmRoot = '${{ steps.llvm.outputs.root }}'
          $tinyRoot = '${{ steps.tiny.outputs.root }}'
          $pairs = @(
            @{ triple='x86_64'; tiny='tcc.exe'; suffix='x64'; machine=0x8664; run=$true },
            @{ triple='i686'; tiny='i386-win32-tcc.exe'; suffix='x86'; machine=0x014c; run=$true },
            @{ triple='aarch64'; tiny='arm64-win32-tcc.exe'; suffix='arm64'; machine=0xaa64; run=$false }
          )
          foreach ($pair in $pairs) {
            $clang = Join-Path $llvmRoot "bin/$($pair.triple)-w64-mingw32-clang.exe"
            $tcc = Get-ChildItem $tinyRoot -Recurse -Filter $pair.tiny | Select-Object -First 1
            if (-not (Test-Path $clang) -or -not $tcc) { throw "compiler missing for $($pair.suffix)" }

            $dll = "build-portable/salts_portable_$($pair.suffix).dll"
            $client = "build-portable/tcc_portable_$($pair.suffix).exe"
            $tss = "build-portable/tcc_tss_$($pair.suffix).exe"
            $c11 = "build-portable/tcc_c11_$($pair.suffix).exe"

            $clangArgs = @(
              '-std=c11','-O2','-shared','-DSALTS_CORE_PLATFORM_BUILD=1','-D_WIN32_WINNT=0x0601',
              '-Iplatform/include','-Icore/include',
              'platform/src/portable_atomic.c','platform/src/portable_thread_win32.c',
              'platform/src/portable_tss_win32.c','platform/src/portable_once.c',
              'platform/src/c11_threads.c','platform/src/clock.c','-o',$dll
            )
            & $clang @clangArgs
            if ($LASTEXITCODE -ne 0) { throw "provider build failed for $($pair.suffix)" }

            & $tcc.FullName '-std=c11' '-Iplatform/include' '-Icore/include' 'tests/portable_tcc_windows_client.c' '-o' $client
            if ($LASTEXITCODE -ne 0) { throw "TinyCC atomic/thread client failed for $($pair.suffix)" }
            & $tcc.FullName '-std=c11' '-Iplatform/include' '-Icore/include' 'tests/portable_tcc_tss_windows.c' '-o' $tss
            if ($LASTEXITCODE -ne 0) { throw "TinyCC TSS client failed for $($pair.suffix)" }
            & $tcc.FullName '-std=c11' '-DSALTS_C11_THREADS_EXPERIMENTAL=1' '-Iplatform/include/salts_core/c11' '-Iplatform/include' '-Icore/include' 'tests/test_c11_threads.c' $dll '-o' $c11
            if ($LASTEXITCODE -ne 0) { throw "TinyCC threads.h client failed for $($pair.suffix)" }

            foreach ($path in @($dll,$client,$tss,$c11)) {
              [byte[]]$bytes = [IO.File]::ReadAllBytes((Resolve-Path $path).Path)
              $pe = [BitConverter]::ToInt32($bytes, 0x3c)
              if ($pe -lt 64 -or [BitConverter]::ToUInt16($bytes, $pe + 4) -ne $pair.machine) {
                throw "wrong PE machine: $path"
              }
            }

            if ($pair.run) {
              $provider = (Resolve-Path $dll).Path
              & (Resolve-Path $client).Path $provider
              if ($LASTEXITCODE -ne 0) { throw "TinyCC atomic/thread runtime failed" }
              & (Resolve-Path $tss).Path $provider
              if ($LASTEXITCODE -ne 0) { throw "TinyCC TSS runtime failed" }
              & (Resolve-Path $c11).Path
              if ($LASTEXITCODE -ne 0) { throw "TinyCC threads.h runtime failed" }
            }
          }

          $manifest = @{}
          foreach ($name in @('salts_portable_arm64.dll','tcc_portable_arm64.exe','tcc_tss_arm64.exe','tcc_c11_arm64.exe')) {
            $manifest[$name] = (Get-FileHash "build-portable/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content build-portable/arm64-manifest.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: core-portable-arm64
          path: |
            build-portable/salts_portable_arm64.dll
            build-portable/tcc_portable_arm64.exe
            build-portable/tcc_tss_arm64.exe
            build-portable/tcc_c11_arm64.exe
            build-portable/arm64-manifest.json
          if-no-files-found: error

  windows-arm64-runtime:
    needs: windows-build
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-portable-arm64
          path: native-arm64
      - name: Run genuine Windows ARM64 TinyCC clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') {
            throw 'native Windows ARM64 hardware is required'
          }
          $manifest = Get-Content native-arm64/arm64-manifest.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($name in $manifest.Keys) {
            $path = (Resolve-Path "native-arm64/$name").Path
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest[$name]) {
              throw "ARM64 artifact hash mismatch: $name"
            }
          }
          $provider = (Resolve-Path native-arm64/salts_portable_arm64.dll).Path
          & (Resolve-Path native-arm64/tcc_portable_arm64.exe).Path $provider
          if ($LASTEXITCODE -ne 0) { throw "ARM64 TinyCC atomic/thread runtime failed" }
          & (Resolve-Path native-arm64/tcc_tss_arm64.exe).Path $provider
          if ($LASTEXITCODE -ne 0) { throw "ARM64 TinyCC TSS runtime failed" }
          & (Resolve-Path native-arm64/tcc_c11_arm64.exe).Path
          if ($LASTEXITCODE -ne 0) { throw "ARM64 TinyCC threads.h runtime failed" }
