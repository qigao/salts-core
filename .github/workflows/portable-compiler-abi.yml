name: Portable Atomic Thread compiler ABI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win-llvm-tinycc:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pin llvm-mingw and TinyCC by SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function FetchPinned([string]$url, [string]$path, [string]$hash) {
            for ($n=1; $n -le 3; $n++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $path
                $observed = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($observed -ne $hash) { throw "Pinned archive mismatch: $observed" }
                return
              } catch {
                if ($n -eq 3) { throw }
                Start-Sleep -Seconds (2 * $n)
              }
            }
          }
          FetchPinned 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' llvm.zip 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          Expand-Archive llvm.zip -DestinationPath tools/llvm -Force
          FetchPinned 'https://github.com/DosX-dev/TinyCC-builder/releases/download/2026-10-22/tinycc-windows-2026-10-22.zip' tinycc.zip '19990b71f401068306ad699aa80af4afaf7f1a7a0110e791022b99da4cbd92e0'
          Expand-Archive tinycc.zip -DestinationPath tools/tinycc-win -Force
      - name: llvm-mingw provider DLL and real TinyCC C callback runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clang = Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang.exe | Select-Object -First 1
          $tcc = Get-ChildItem tools/tinycc-win -Recurse -Filter tcc.exe | Select-Object -First 1
          if (-not $clang -or -not $tcc) { throw 'Pinned compiler binaries absent' }
          New-Item -ItemType Directory -Force build-portable | Out-Null
          $dll = 'build-portable/salts_portable.dll'
          $exe = 'build-portable/tcc_portable.exe'
          & $clang.FullName '-std=c11' '-O2' '-shared' '-DSALTS_CORE_PLATFORM_BUILD=1' '-D_WIN32_WINNT=0x0601' '-Iinclude' 'src/platform/portable_atomic.c' 'src/platform/portable_thread_win32.c' 'src/platform/portable_once.c' '-o' $dll
          if ($LASTEXITCODE -ne 0) { throw 'Portable Platform provider failed to compile/link with llvm-mingw' }
          & $tcc.FullName '-std=c11' '-Iinclude' 'tests/portable_tcc_windows_client.c' '-o' $exe
          if ($LASTEXITCODE -ne 0) { throw 'TinyCC portable consumer compile failed' }
          $provider = (Resolve-Path $dll).Path
          for ($i=1; $i -le 10; $i++) {
            & (Resolve-Path $exe).Path $provider
            if ($LASTEXITCODE -ne 0) { throw "TinyCC/llvm-mingw Atomic+Thread ABI failed ($i)" }
          }
  linux-native-tinycc:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable native TinyCC source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TinyCC/tinycc.git tools/tcc-src
          git -C tools/tcc-src checkout --detach e23dabed154a8495f3ac1ff3cc9d04fa1c207893
          cd tools/tcc-src
          ./configure --prefix="$GITHUB_WORKSPACE/tools/tcc-installed"
          make -j2
          make install
      - name: Real TinyCC C consumer of GCC platform Atomic/Thread DSO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-portable
          gcc -std=c11 -O2 -pthread -fPIC -shared -DSALTS_CORE_PLATFORM_BUILD=1 -Iinclude \
            src/platform/portable_atomic.c src/platform/portable_thread_posix.c \
            src/platform/portable_once.c -o build-portable/libsalts_portable.so
          "$GITHUB_WORKSPACE/tools/tcc-installed/bin/tcc" -Iinclude \
            tests/test_portable_concurrency.c -Lbuild-portable -lsalts_portable \
            -o build-portable/tcc_platform_consumer
          export LD_LIBRARY_PATH="$PWD/build-portable:$(printenv LD_LIBRARY_PATH || true)"
          for i in 1 2 3 4 5; do ./build-portable/tcc_platform_consumer; done
