name: SaltsCore native LLVM contract
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: macos-15, arch: arm64}
          - {os: windows-2025, arch: x64}
          - {os: windows-11-arm, arch: arm64}
    name: "Core LLVM / ${{ matrix.os }} / ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select runner-native LLVM
        if: runner.os != 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@master
      - name: Select llvm-mingw UCRT
        if: runner.os == 'Windows'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@master
        with:
          target: ${{ matrix.arch }}
          version: "20261020"
      - name: Configure, compile, test, and install
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_COMPILER_TOOLCHAIN_FILE" -DBUILD_TESTING=ON -DSALTSCORE_BUILD_TINYTEST=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/saltscore-sdk"
          cmake --build build --config Release --parallel 2
          ctest --test-dir build --output-on-failure -C Release
          cmake --install build --config Release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-llvm-${{ matrix.os }}-${{ matrix.arch }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
