name: SaltsCore original MPMC migration

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/SaltsCoreConfig.cmake.in"
      - "concurrency/**"
      - "platform/**"
      - "tests/CMakeLists.txt"
      - "tests/test_bucket_priority_queue_mpmc.c"
      - "tests/installed/**"
      - ".github/workflows/mpmc-native.yml"
      - ".github/actions/setup-core-native/**"
      - "crypto/native/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-mpmc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Preserve source-lock Git blob bytes from the initial checkout.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  mpmc:
    name: "MPMC ${{ matrix.profile }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-release
            flags: ""
          - os: ubuntu-24.04
            profile: linux-asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - os: ubuntu-24.04
            profile: linux-tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - os: windows-2025
            profile: windows-release
            flags: ""
          - os: macos-15
            profile: macos-release
            flags: ""
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      MPMC_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-mpmc-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact prerequisites for the default local Crypto and CNet graph
        uses: ./.github/actions/setup-core-native
        with:
          dependency-mode: source
          token: ${{ github.token }}
      - name: Build the complete configured native graph
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$MPMC_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$MPMC_FLAGS" "-DCMAKE_CXX_FLAGS=$MPMC_FLAGS")
          fi
          cmake -S . "-DCMAKE_TOOLCHAIN_FILE=$CORE_CI_TOOLCHAIN" "-DVCPKG_TARGET_TRIPLET=$CORE_CI_TRIPLET" "-DVCPKG_HOST_TRIPLET=$CORE_CI_HOST_TRIPLET" -B build-mpmc -G Ninja \
            -DBUILD_TESTING=ON -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/mpmc-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-mpmc --config Release --parallel 2
      - name: Original cases, independent delivery and existing concurrency contracts
        shell: bash
        run: |
          set -euo pipefail
          for case in original_bucket_mpmc mpmc_delivery_contract concurrency \
                      portable_concurrency c11_threads_facade; do
            ctest --test-dir build-mpmc -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^saltscore[.]${case}$"
          done
          for case in disruptor_test thread_pool_test thread_pool_lf_test \
                      deadline_queue_test rcu_test typed_primitives_test \
                      concurrency_header_cpp_test typed_rcu_cpp_test; do
            ctest --test-dir build-mpmc -C Release --output-on-failure \
              --no-tests=error --timeout 120 \
              -R "^saltscore[.]original_concurrency[.]${case}$"
          done
          cmake --install build-mpmc --config Release
      - name: Build and run independent installed C11 and C++17 consumers
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ -n "$MPMC_FLAGS" ]]; then
            args+=("-DCMAKE_C_FLAGS=$MPMC_FLAGS" "-DCMAKE_CXX_FLAGS=$MPMC_FLAGS")
          fi
          case "$RUNNER_OS" in
            Windows) export PATH="$(cygpath -u "$RUNNER_TEMP")/mpmc-sdk/bin:$PATH" ;;
            macOS) export DYLD_LIBRARY_PATH="$RUNNER_TEMP/mpmc-sdk/lib:${DYLD_LIBRARY_PATH:-}" ;;
            Linux) export LD_LIBRARY_PATH="$RUNNER_TEMP/mpmc-sdk/lib:${LD_LIBRARY_PATH:-}" ;;
          esac
          cmake -S tests/installed -B build-mpmc-installed -G Ninja \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/mpmc-sdk" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "${args[@]}"
          cmake --build build-mpmc-installed --config Release --parallel 2
          for lang in c11 cpp17; do
            ctest --test-dir build-mpmc-installed -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^sdk[.]mpmc_${lang}$"
            ctest --test-dir build-mpmc-installed -C Release --output-on-failure \
              --no-tests=error --timeout 120 -R "^sdk[.]original_threadpool_lf_${lang}$"
          done
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpmc-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-mpmc/Testing/Temporary/LastTest.log
            build-mpmc-installed/Testing/Temporary/LastTest.log
          if-no-files-found: error
