name: SaltsCore original Capture backends and installed ABI

on:
  pull_request:
    paths:
      - capture/**
      - core/**
      - platform/**
      - CMakeLists.txt
      - cmake/SaltsCoreConfig.cmake.in
      - vcpkg.json
      - vcpkg-configuration.json
      - tools/migration/**
      - .github/workflows/capture-native.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  capture:
    name: Capture ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {os: ubuntu-24.04, profile: linux-release, triplet: x64-linux, host: x64-linux, cross: '', sanitize: false}
          - {os: ubuntu-24.04, profile: linux-asan-ubsan, triplet: x64-linux, host: x64-linux, cross: '', sanitize: true}
          - {os: ubuntu-24.04-arm, profile: linux-arm64-release, triplet: arm64-linux, host: arm64-linux, cross: '', sanitize: false}
          - {os: windows-2025, profile: windows-release, triplet: qigao-x64-windows-v145, host: qigao-x64-windows-v145, cross: '', sanitize: false}
          - {os: macos-15, profile: macos-release, triplet: arm64-osx, host: arm64-osx, cross: '', sanitize: false}
          - {os: ubuntu-24.04, profile: android-arm64, triplet: arm64-android, host: x64-linux, cross: android, sanitize: false}
          - {os: macos-15, profile: ios-arm64, triplet: arm64-ios, host: arm64-osx, cross: ios, sanitize: false}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verified compiler cache where the fixed action has a native binary
        if: matrix.profile != 'linux-arm64-release'
        uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-capture-${{ matrix.profile }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the actual Linux PipeWire and X11 SDKs
        if: runner.os == 'Linux' && matrix.cross == ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libx11-dev libxext-dev pkg-config
      - name: Canonical cached private miniaudio, libyuv and JPEG dependencies
        id: dependencies
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
          triplet: ${{ matrix.triplet }}
          host-triplet: ${{ matrix.host }}
          features: capture
      - name: Build all configured targets and retain all original platform tests
        shell: bash
        env:
          CAPTURE_TOOLCHAIN: ${{ steps.dependencies.outputs.toolchain_file }}
          CAPTURE_CROSS: ${{ matrix.cross }}
          CAPTURE_SANITIZE: ${{ matrix.sanitize }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > "$RUNNER_TEMP/capture-source-head.txt"
          python -m unittest discover -s capture/tests -p test_source_provenance.py -v
          args=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded)
          if [ "$CAPTURE_SANITIZE" = true ]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags"
                   '-DCMAKE_C_FLAGS_RELEASE=-O1 -g -DNDEBUG' '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG')
          fi
          if [ "$CAPTURE_CROSS" = android ]; then
            test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
            args+=("-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
                   -DCMAKE_SYSTEM_NAME=Android -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26)
          elif [ "$CAPTURE_CROSS" = ios ]; then
            args+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
                   -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
                   -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake -S . -B "$RUNNER_TEMP/capture-build" -G Ninja "${args[@]}" \
            -DBUILD_TESTING=ON -DSALTSCORE_BUILD_CAPTURE=ON -DSALTSCORE_BUILD_TINYTEST=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$CAPTURE_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.host }} \
            -DVCPKG_MANIFEST_FEATURES=capture -DCMAKE_INSTALL_LIBDIR=lib \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/capture-sdk"
          cmake --build "$RUNNER_TEMP/capture-build" --config Release --parallel 2
          cmake --install "$RUNNER_TEMP/capture-build" --config Release
      - name: Verify registered original tests and execute supported native rows
        shell: bash
        env:
          CAPTURE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/capture-build/bin:$RUNNER_TEMP/capture-sdk/bin:$PATH"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          build = Path(os.environ['RUNNER_TEMP']) / 'capture-build'
          listing = json.loads(subprocess.check_output(
              ['ctest','--test-dir',str(build),'-C','Release','--show-only=json-v1'], text=True))
          (build/'capture-ctest-inventory.json').write_text(json.dumps(listing, indent=2))
          expected = {'saltscore.capture_source_provenance'}
          cross = os.environ['CAPTURE_CROSS']
          if cross == 'android':
              expected.add('capture_android_test')
          elif cross != 'ios':
              expected |= ({'capture_windows_test', 'capture_exposure_windows_test'}
                           if os.environ['RUNNER_OS'] == 'Windows' else {'capture_posix_test'})
          cases = {case['name']:case for case in listing['tests']}
          if not expected <= cases.keys():
              raise SystemExit('Original Capture platform tests are missing')
          for name in expected:
              properties = {p['name']:p['value'] for p in cases[name].get('properties',[])}
              if properties.get('DISABLED') or 'SKIP_RETURN_CODE' in properties or 'SKIP_REGULAR_EXPRESSION' in properties:
                  raise SystemExit('Original Capture test was disabled or made skippable: ' + name)
          selected = {'saltscore.capture_source_provenance'} if cross else expected
          pattern = '^(' + '|'.join(re.escape(name) for name in sorted(selected)) + ')$'
          subprocess.run(['ctest','--test-dir',str(build),'-C','Release','--no-tests=error',
                          '--output-on-failure','--timeout','90','-R',pattern],check=True)
          if cross:
              print('Cross-compiled original tests only; no device execution has been claimed')
          PY
      - name: Build independent installed C11 and C++17 consumers with every public API reference
        shell: bash
        env:
          CAPTURE_TOOLCHAIN: ${{ steps.dependencies.outputs.toolchain_file }}
          CAPTURE_CROSS: ${{ matrix.cross }}
          CAPTURE_SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
                -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DVCPKG_MANIFEST_MODE=OFF)
          if [ "$CAPTURE_SANITIZE" = true ]; then
            flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
            args+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags"
                   '-DCMAKE_C_FLAGS_RELEASE=-O1 -g -DNDEBUG' '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -g -DNDEBUG')
          fi
          if [ "$CAPTURE_CROSS" = android ]; then
            args+=("-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
                   -DCMAKE_SYSTEM_NAME=Android -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26)
          elif [ "$CAPTURE_CROSS" = ios ]; then
            args+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
                   -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
                   -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake -S capture/tests/installed -B "$RUNNER_TEMP/capture-consumer" -G Ninja \
            "${args[@]}" "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/capture-sdk" \
            "-DCMAKE_TOOLCHAIN_FILE=$CAPTURE_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_HOST_TRIPLET=${{ matrix.host }}
          cmake --build "$RUNNER_TEMP/capture-consumer" --config Release --parallel 2
          if [ -z "$CAPTURE_CROSS" ]; then
            export PATH="$RUNNER_TEMP/capture-sdk/bin:$PATH"
            export LD_LIBRARY_PATH="$RUNNER_TEMP/capture-sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export DYLD_LIBRARY_PATH="$RUNNER_TEMP/capture-sdk/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            ctest --test-dir "$RUNNER_TEMP/capture-consumer" -C Release \
              --output-on-failure --no-tests=error --timeout 30
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/capture-source-head.txt
            ${{ runner.temp }}/capture-build/compile_commands.json
            ${{ runner.temp }}/capture-build/capture-ctest-inventory.json
            ${{ runner.temp }}/capture-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/capture-consumer/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/capture-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  original-virtual-audio-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Actual PipeWire/X11 SDK and isolated software PulseAudio server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libx11-dev libxext-dev pkg-config pulseaudio pulseaudio-utils
      - uses: qigao/stun/.github/actions/setup-ccache@6498e9710609820da7d99a938627cc44f17f00ed
        with:
          profile: saltscore-capture-original-tsan
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned private miniaudio input
        id: dependencies
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
          triplet: x64-linux
          host-triplet: x64-linux
          features: capture
      - name: Instrument the real standalone Core owner and exact original Capture regression
        shell: bash
        env:
          CAPTURE_TOOLCHAIN: ${{ steps.dependencies.outputs.toolchain_file }}
        run: |
          set -euo pipefail
          flags='-fsanitize=thread -fno-omit-frame-pointer -g -O1'
          cmake -S . -B "$RUNNER_TEMP/capture-tsan-core" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_TOOLCHAIN_FILE=$CAPTURE_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_FEATURES=capture \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/capture-tsan-core-sdk"
          cmake --build "$RUNNER_TEMP/capture-tsan-core" --parallel 2
          cmake --install "$RUNNER_TEMP/capture-tsan-core"
          export SALTS_ROOT="$RUNNER_TEMP/capture-tsan-core-sdk"
          cmake -S capture/tests/native_tsan -B "$RUNNER_TEMP/capture-original-tsan" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags" \
            "-DNATIVE_TSAN_MINIAUDIO_ROOT=$RUNNER_TEMP/capture-tsan-core/vcpkg_installed/x64-linux/include"
          cmake --build "$RUNNER_TEMP/capture-original-tsan" --parallel 2
          # This retained harness allows one CI-owned software null monitor and
          # no physical audio cards; it checks all six markers on 12 executions.
          bash capture/tests/native_tsan/run_private_pulse.sh "$RUNNER_TEMP/capture-original-tsan"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-original-tsan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/capture-original-tsan/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/capture-original-tsan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
