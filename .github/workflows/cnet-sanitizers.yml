name: SaltsCore CNet runtime sanitizer gates

# Scoped to runtime ABI/owner changes; this expensive matrix is not run for
# docs-only / unrelated SDK edits. It is independently re-runnable by dispatch.
on:
  pull_request:
    paths:
      - ".github/actions/setup-ccache/**"
      - ".github/workflows/cnet-sanitizers.yml"
      - "CMakeLists.txt"
      - "cnet/CMakeLists.txt"
      - "vendor/CMakeLists.txt"
      - "core/CMakeLists.txt"
      - "platform/CMakeLists.txt"
      - "native-io/CMakeLists.txt"
      - "concurrency/CMakeLists.txt"
      - "coroutine/CMakeLists.txt"
      - "uri/CMakeLists.txt"
      - "core/src/**"
      - "platform/src/**"
      - "concurrency/src/**"
      - "coroutine/src/**"
      - "native-io/src/**"
      - "cnet/src/**"
      - "tests/test_runtime_plugins.c"
      - "tests/runtime_loaded_plugin.c"
      - "tests/test_cnet_tcp_loopback.c"
      - "tests/test_readiness.c"
      - "tests/test_readiness_faults.c"
      - "tests/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-fifo-workflows
  cancel-in-progress: false
  queue: max

jobs:
  linux-runtime-sanitizers:
    concurrency:
      group: saltscore-fifo-runners
      cancel-in-progress: false
      queue: max
    name: Linux CNet ${{ matrix.kind }} live owner contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - kind: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - kind: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA256-pinned compiler ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          profile: saltscore-${{ github.job }}-${{ strategy.job-index }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore exact re2c from shared vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          token: ${{ github.token }}
      - name: Install pinned native provider build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool \
            curl zip unzip tar
      - name: Restore immutable vcpkg ABI packages (curl-only)
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache@7bb5b556a001bc82d2922a04a718e986a7f47f54
        with:
          mode: read
          triplet: x64-linux
          host-triplet: x64-linux
          manifest-root: .
          features: cnet
      - name: Configure and build instrumented real CNet/GmSSL
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "build-sanitize-${{ matrix.kind }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON
          cmake --build "build-sanitize-${{ matrix.kind }}" --parallel 2
      - name: Exercise bounded real TCP and cross-plugin owner races
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.kind }}' == 'asan-ubsan' ]]; then
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1:abort_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          else
            export TSAN_OPTIONS='halt_on_error=1:exitcode=66'
          fi
          ctest --test-dir "build-sanitize-${{ matrix.kind }}" \
            -C RelWithDebInfo --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3 \
            -R '^saltscore[.](two_cnet_plugins|cnet_tcp_loopback|buffer|native_io|readiness_owner|readiness_faults|readiness_close_race)$'
      - name: ccache compilation statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: ccache --show-stats
