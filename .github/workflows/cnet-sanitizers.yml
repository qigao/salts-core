name: SaltsCore CNet runtime sanitizer gates

# Scoped to runtime ABI/owner changes; this expensive matrix is not run for
# docs-only / unrelated SDK edits. It is independently re-runnable by dispatch.
on:
  pull_request:
    paths:
      - ".github/workflows/cnet-sanitizers.yml"
      - "CMakeLists.txt"
      - "cmake/SaltsCoreCNet.cmake"
      - "src/core/**"
      - "src/platform/**"
      - "src/concurrency/**"
      - "src/coroutine/**"
      - "src/native-io/**"
      - "src/cnet/**"
      - "tests/test_runtime_plugins.c"
      - "tests/runtime_loaded_plugin.c"
      - "tests/test_cnet_tcp_loopback.c"
      - "tests/test_readiness.c"
      - "tests/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux-runtime-sanitizers:
    name: Linux CNet ${{ matrix.kind }} live owner contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          - kind: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native provider build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm re2c autoconf automake libtool \
            curl zip unzip tar
      - name: Bootstrap canonical pinned vcpkg scripts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/saltscore-vcpkg"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --no-tags origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" checkout --detach FETCH_HEAD
          git -C "$root" fetch --no-tags origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          test "$(git -C "$root" rev-parse HEAD)" = 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" cat-file -e "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01:versions/baseline.json"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Restore existing files-only Linux provider cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: saltscore-cnet-x64-linux-v8-04a9d8e5-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Configure and build instrumented real CNet/GmSSL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/build/vcpkg-binary-cache,readwrite"
          cmake -S . -B "build-sanitize-${{ matrix.kind }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=${{ matrix.flags }}" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON
          cmake --build "build-sanitize-${{ matrix.kind }}" --parallel 2
      - name: Exercise bounded real TCP and cross-plugin owner races
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.kind }}' == 'asan-ubsan' ]]; then
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1:abort_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          else
            export TSAN_OPTIONS='halt_on_error=1:exitcode=66'
          fi
          ctest --test-dir "build-sanitize-${{ matrix.kind }}" \
            -C RelWithDebInfo --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3 \
            -R '^saltscore[.](two_cnet_plugins|cnet_tcp_loopback|buffer|native_io|readiness_owner)

