name: CNet M5 original NativeIO Owner required mTLS / one static Crypto
on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "tests/cnet-crypto-static/**"
      - "cnet/src/cnet_tls_crypto_qualification.*"
      - "cnet/CMakeLists.txt"
      - "asn1/**"
      - "crypto/**"
      - "vendor/gmssl-extensions/**"
      - "tools/check_crypto_pr43_handoff.py"
      - "tools/crypto_pr43_retirement_manifest.json"
      - "vendor/CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "native-io/CMakeLists.txt"
      - "tests/cnet-owner/**"
      - "tools/check_dependency_boundaries.py"
      - "tests/test_dependency_boundaries.py"
      - ".github/workflows/cnet-m5-python-mtls.yml"
      - ".github/actions/setup-core-native/**"
      - "crypto/native/**"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  # Preserve source-lock Git blob bytes from the initial checkout.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  posix-static-admission:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triplet: x64-linux
          - runner: macos-15
            triplet: arm64-osx
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config             autoconf automake libtool nasm curl zip unzip tar re2c
      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja pkg-config autoconf automake libtool nasm re2c
      - name: Python-only mTLS certificate generator (no OpenSSL CLI/dev)
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "cryptography==46.0.4"
          python3 -c 'import ssl, cryptography; assert ssl.HAS_TLSv1_3'
      - name: Verify local Crypto source and immutable qualification provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_crypto_module_ownership.py
          python3 tools/check_crypto_pr43_handoff.py
          python3 -m unittest discover -s tests -p 'test_crypto_pr43_handoff.py' -v
      - name: Restore exact prerequisites for the default local Crypto and CNet graph
        uses: ./.github/actions/setup-core-native
        with:
          token: ${{ github.token }}
      - name: Build and audit source-local ASN1/Crypto static modules
        shell: bash
        run: |
          set -euo pipefail
          cmake -S asn1 -B "$RUNNER_TEMP/native-asn1-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/crypto-installed"
          cmake --build "$RUNNER_TEMP/native-asn1-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/native-asn1-build" -C Release \
            --output-on-failure --no-tests=error
          cmake --install "$RUNNER_TEMP/native-asn1-build" --config Release
          cmake -S crypto -B "$RUNNER_TEMP/crypto-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-installed" \
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/crypto-installed"
          cmake --build "$RUNNER_TEMP/crypto-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/crypto-build" -C Release \
            --output-on-failure --no-tests=error
          cmake --install "$RUNNER_TEMP/crypto-build" --config Release
          python3 crypto/tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/crypto-installed" \
            --report "$RUNNER_TEMP/crypto-static-audit.json"
      - name: M2 original CNet Owner NativeIO over one static Crypto
        shell: bash
        run: |
          set -euo pipefail
          # Production CNet and these qualification targets use the same local Crypto
          # source. Isolated candidate binaries still must not import the production CNet DSO.
          cmake -S . -B "$RUNNER_TEMP/core-static-owner-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$CORE_CI_TOOLCHAIN" \
            "-DVCPKG_TARGET_TRIPLET=$CORE_CI_TRIPLET" \
            "-DVCPKG_HOST_TRIPLET=$CORE_CI_HOST_TRIPLET" \
            -DSALTSCORE_BUILD_URI=ON \
            -DSALTSCORE_TEST_CNET_CRYPTO_QUALIFICATION=ON \
            -DSALTSCORE_CNET_STATIC_CRYPTO_OPENSSL_SAN_TEST=ON \
            -DSALTSCORE_CNET_M5_PYTHON_MTLS_TEST=ON \
            -DSALTSCORE_CNET_M6_SHARED_DSO_TEST=ON \
            -DSALTSCORE_CNET_M6_CONCURRENT_MTLS_TEST=ON \
            "-DSALTSCORE_CRYPTO_PYTHON_FIXTURE_SOURCE=$GITHUB_WORKSPACE/crypto/tests/sdk/python_mtls.py" \
            "-DSALTSCORE_CRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/crypto/tests/fixtures"
          cmake --build "$RUNNER_TEMP/core-static-owner-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/core-static-owner-build" -C Release \
            --output-on-failure --no-tests=error \
            -R '^saltscore[.]cnet_crypto_static_(original_owner_tls12_tls13|python_san_tls12|python_san_tls13|original_owner_python_mtls)$' \
            --repeat until-fail:1
          ctest --test-dir "$RUNNER_TEMP/core-static-owner-build" -C Release \
            --output-on-failure --no-tests=error \
            -R '^saltscore[.]cnet_crypto_m6_two_plugin_(shared_owner|concurrent_mtls)$' \
            --repeat until-fail:3
          ctest --test-dir "$RUNNER_TEMP/core-static-owner-build" -C Release \
            --output-on-failure --no-tests=error \
            -R '^saltscore[.]cnet_(tcp_loopback|tls_ca_san)$'
          candidate="$RUNNER_TEMP/core-static-owner-build/tests/cnet-crypto-static/saltscore_cnet_crypto_static_original_owner"
          test -x "$candidate"
          if [ "${{ runner.os }}" = "Linux" ]; then
            readelf -d "$candidate" > "$RUNNER_TEMP/cnet-static-owner-imports.txt"
          else
            otool -L "$candidate" > "$RUNNER_TEMP/cnet-static-owner-imports.txt"
          fi
          grep -Eiq 'saltscore_core' "$RUNNER_TEMP/cnet-static-owner-imports.txt"
          if grep -Ei 'libgmssl|libcrypto_tls|libcrypto_provider|libsaltscore_cnet' \
            "$RUNNER_TEMP/cnet-static-owner-imports.txt"; then
            echo "SECURITY FAIL: candidate imported a second provider" >&2
            exit 1
          fi
      - name: M6 audit shared physical Crypto Owner imports (ELF/Mach-O)
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/core-static-owner-build"
          owner=$(find "$build" -type f \
            \( -name 'libsaltscore_cnet_m6_static_crypto.so' -o \
               -name 'libsaltscore_cnet_m6_static_crypto.dylib' \) -print -quit)
          host=$(find "$build" -type f \
            -name saltscore_cnet_m6_two_plugin_loader -print -quit)
          test -n "$owner" && test -n "$host"
          for module in a b; do
            plugin=$(find "$build" -type f \
              \( -name "libsaltscore_cnet_m6_plugin_$module.so" -o \
                 -name "libsaltscore_cnet_m6_plugin_$module.dylib" \) -print -quit)
            test -n "$plugin"
            if [ "${{ runner.os }}" = "Linux" ]; then
              readelf -d "$plugin" > "$RUNNER_TEMP/cnet-m6-plugin-$module-imports.txt"
            else
              otool -L "$plugin" > "$RUNNER_TEMP/cnet-m6-plugin-$module-imports.txt"
            fi
            grep -Fq 'saltscore_cnet_m6_static_crypto' \
              "$RUNNER_TEMP/cnet-m6-plugin-$module-imports.txt"
            if grep -Eiq 'libgmssl|libsalts_crypto|libsaltscore_cnet[.](so|dylib)|libcrypto_provider|libcrypto_tls' \
              "$RUNNER_TEMP/cnet-m6-plugin-$module-imports.txt"; then
              echo "M6 fail: plugin imported a second physical TLS owner" >&2
              exit 1
            fi
          done
          if [ "${{ runner.os }}" = "Linux" ]; then
            readelf -d "$owner" > "$RUNNER_TEMP/cnet-m6-owner-imports.txt"
            readelf -d "$host" > "$RUNNER_TEMP/cnet-m6-host-imports.txt"
          else
            otool -L "$owner" > "$RUNNER_TEMP/cnet-m6-owner-imports.txt"
            # otool -L first prints the executable path as a heading.
            # That is NOT a dependency and contains "saltscore_cnet_m6".
            # Keep only actual linked dylib entries, without omitting any.
            otool -L "$host" | sed '1d' > "$RUNNER_TEMP/cnet-m6-host-imports.txt"
          fi
          if grep -Eiq 'libgmssl|libsalts_crypto|libsaltscore_cnet[.](so|dylib)|libcrypto_provider|libcrypto_tls' \
            "$RUNNER_TEMP/cnet-m6-owner-imports.txt"; then
            echo "M6 fail: shared CNet candidate imports a second TLS provider" >&2
            exit 1
          fi
          if grep -Eiq 'saltscore_cnet|gmssl|salts_crypto|crypto_tls|crypto_provider' \
            "$RUNNER_TEMP/cnet-m6-host-imports.txt"; then
            echo "M6 fail: host directly links CNet or Crypto" >&2
            exit 1
          fi
      - name: Preserve exact-head candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-static-m0-${{ matrix.triplet }}
          path: |
            ${{ runner.temp }}/crypto-static-audit.json
            ${{ runner.temp }}/cnet-static-imports.txt
            ${{ runner.temp }}/cnet-static-symbols.txt
            ${{ runner.temp }}/cnet-static-owner-imports.txt
            ${{ runner.temp }}/cnet-m6-owner-imports.txt
            ${{ runner.temp }}/cnet-m6-host-imports.txt
            ${{ runner.temp }}/cnet-m6-plugin-a-imports.txt
            ${{ runner.temp }}/cnet-m6-plugin-b-imports.txt
            ${{ runner.temp }}/core-static-owner-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/core-static-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows-static-admission:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Python mTLS certificate generator
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "cryptography==46.0.4"
          if ($LASTEXITCODE -ne 0) { throw 'Python X509 fixtures unavailable' }
      - name: Verify local Crypto source and immutable qualification provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/check_crypto_module_ownership.py
          if ($LASTEXITCODE -ne 0) { throw 'Local Crypto source owner failed' }
          python tools/check_crypto_pr43_handoff.py
          if ($LASTEXITCODE -ne 0) { throw 'PR43 local source SHA handoff failed' }
          python -m unittest discover -s tests -p test_crypto_pr43_handoff.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PR43 source provenance test failed' }
      - name: Restore exact prerequisites for the default local Crypto and CNet graph
        uses: ./.github/actions/setup-core-native
        with:
          token: ${{ github.token }}
      - name: Build and audit local ASN1/Crypto static modules (MSVC x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'crypto-installed'
          & cmake -S asn1 -B "$env:RUNNER_TEMP/native-asn1-build" -G 'Visual Studio 18 2026' -A x64 -DBUILD_TESTING=ON "-DCMAKE_INSTALL_PREFIX=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Local ASN1 configure failed' }
          & cmake --build "$env:RUNNER_TEMP/native-asn1-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Local ASN1 build failed' }
          & ctest --test-dir "$env:RUNNER_TEMP/native-asn1-build" -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Local ASN1 tests failed' }
          & cmake --install "$env:RUNNER_TEMP/native-asn1-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Local ASN1 install failed' }
          & cmake -S crypto -B "$env:RUNNER_TEMP/crypto-build" -G 'Visual Studio 18 2026' -A x64 -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$sdk" "-DCMAKE_INSTALL_PREFIX=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Local Crypto configure failed' }
          & cmake --build "$env:RUNNER_TEMP/crypto-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Local Crypto build failed' }
          & ctest --test-dir "$env:RUNNER_TEMP/crypto-build" -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Local Crypto tests failed' }
          & cmake --install "$env:RUNNER_TEMP/crypto-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Local Crypto install failed' }
          python crypto/tools/audit_static_crypto.py --prefix $sdk --report "$env:RUNNER_TEMP/crypto-static-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Local static ASN1/Crypto archive audit failed' }
      - name: M2 full original CNet Owner with STATIC Crypto and real Windows IOCP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'core-static-owner-build'
          $sdk = Join-Path $env:RUNNER_TEMP 'crypto-installed'
          $toolchain = $env:CORE_CI_TOOLCHAIN
          $params = @(
            '-S', '.', '-B', $build, '-G', 'Visual Studio 18 2026', '-A', 'x64',
            '-DBUILD_TESTING=ON',
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=$env:CORE_CI_TRIPLET",
            "-DVCPKG_HOST_TRIPLET=$env:CORE_CI_HOST_TRIPLET",
            '-DSALTSCORE_BUILD_URI=ON',
            '-DSALTSCORE_TEST_CNET_CRYPTO_QUALIFICATION=ON',
            '-DSALTSCORE_CNET_STATIC_CRYPTO_OPENSSL_SAN_TEST=ON',
            '-DSALTSCORE_CNET_M5_PYTHON_MTLS_TEST=ON',
            '-DSALTSCORE_CNET_M6_SHARED_DSO_TEST=ON',
            '-DSALTSCORE_CNET_M6_CONCURRENT_MTLS_TEST=ON',
            "-DSALTSCORE_CRYPTO_PYTHON_FIXTURE_SOURCE=$env:GITHUB_WORKSPACE/crypto/tests/sdk/python_mtls.py",
            "-DSALTSCORE_CRYPTO_TEST_FIXTURES=$env:GITHUB_WORKSPACE/crypto/tests/fixtures")
          & cmake @params
          if ($LASTEXITCODE -ne 0) { throw 'Original Owner static CNet configure failed' }
          & cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Original Owner static CNet compile/link failed' }
          & ctest --test-dir $build -C Release --output-on-failure --no-tests=error -R '^saltscore[.]cnet_crypto_static_(original_owner_tls12_tls13|python_san_tls12|python_san_tls13|original_owner_python_mtls)$' --repeat until-fail:1
          if ($LASTEXITCODE -ne 0) { throw 'M2 genuine IOCP Crypto TLS Owner failed' }
          & ctest --test-dir $build -C Release --output-on-failure --no-tests=error -R '^saltscore[.]cnet_crypto_m6_two_plugin_(shared_owner|concurrent_mtls)$' --repeat until-fail:3
          if ($LASTEXITCODE -ne 0) { throw 'M6 two-plugin sole Crypto runtime failed on IOCP' }
          & ctest --test-dir $build -C Release --output-on-failure --no-tests=error -R '^saltscore[.]cnet_(tcp_loopback|tls_ca_san)$'
          if ($LASTEXITCODE -ne 0) { throw 'Production local-Crypto CNet regression failed' }
          $binary = Join-Path $build 'bin/Release/saltscore_cnet_crypto_static_original_owner.exe'
          if (-not (Test-Path $binary)) { throw 'Original Owner candidate binary missing' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsroot = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsroot 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'MSVC dumpbin missing' }
          $imports = Join-Path $env:RUNNER_TEMP 'cnet-static-owner-imports.txt'
          & $dumpbin.FullName /DEPENDENTS $binary | Out-File -FilePath $imports -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'M2 PE import dump failed' }
          if (-not (Select-String -Path $imports -Pattern 'saltscore_core' -Quiet)) {
            throw 'Shared foundation Owner missing from candidate PE imports'
          }
          if (Select-String -Path $imports -Pattern 'gmssl.*dll|crypto_tls.*dll|crypto_provider.*dll|saltscore_cnet.*dll') {
            throw 'SECURITY FAIL: original candidate imported duplicate native provider'
          }
      - name: M6 audit two Windows plugin DLLs and shared Crypto candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'core-static-owner-build/bin/Release'
          $owner = Join-Path $bin 'saltscore_cnet_m6_static_crypto.dll'
          $m6HostExecutable = Join-Path $bin 'saltscore_cnet_m6_two_plugin_loader.exe'
          if (-not (Test-Path $owner) -or -not (Test-Path $m6HostExecutable)) {
            throw 'M6 candidate DLL or host executable missing'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsroot = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsroot 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'M6 dumpbin unavailable' }
          function Save-M6PeImports([string]$image, [string]$report) {
            $output = & $dumpbin.FullName /DEPENDENTS $image
            if ($LASTEXITCODE -ne 0) { throw "M6 PE import audit failed for $image" }
            # Restrict to the DLL dependency-name lines. The dumpbin
            # "Dump of file $image" header is NOT a linked dependency.
            $deps = @($output | Where-Object { $_ -match '^\s+[^\s:]+[.]dll\s*$' } |
                        ForEach-Object { $_.Trim() })
            if ($deps.Count -eq 0) { throw "M6 PE import list unexpectedly empty: $image" }
            $deps | Set-Content -Path $report -Encoding utf8
          }
          foreach ($module in @('a','b')) {
            # MSVC MODULE targets go to the module-owned build subdirectory, while the
            # executable and SHARED candidate are in <build>/bin/Release.
            $plugin = Join-Path $env:RUNNER_TEMP "core-static-owner-build/tests/cnet-crypto-static/Release/saltscore_cnet_m6_plugin_$module.dll"
            if (-not (Test-Path $plugin)) { throw "M6 plugin $module missing" }
            $report = Join-Path $env:RUNNER_TEMP "cnet-m6-plugin-$module-imports.txt"
            Save-M6PeImports $plugin $report
            if (-not (Select-String -Path $report -Pattern 'saltscore_cnet_m6_static_crypto' -Quiet)) {
              throw "M6 plugin $module does not resolve sole shared Crypto Owner"
            }
            if (Select-String -Path $report -Pattern 'gmssl.*dll|salts_crypto.*dll|saltscore_cnet-[0-9]|crypto_provider.*dll|crypto_tls.*dll') {
              throw "M6 plugin $module imports a second TLS implementation"
            }
          }
          foreach ($entry in @(@('cnet-m6-owner-imports.txt', $owner),
                               @('cnet-m6-host-imports.txt', $m6HostExecutable))) {
            $report = Join-Path $env:RUNNER_TEMP $entry[0]
            Save-M6PeImports $entry[1] $report
          }
          if (Select-String -Path (Join-Path $env:RUNNER_TEMP 'cnet-m6-owner-imports.txt') -Pattern 'gmssl.*dll|salts_crypto.*dll|saltscore_cnet-[0-9]|crypto_provider.*dll|crypto_tls.*dll') {
            throw 'M6 shared CNet candidate imported a second TLS provider'
          }
          if (Select-String -Path (Join-Path $env:RUNNER_TEMP 'cnet-m6-host-imports.txt') -Pattern 'saltscore_cnet|gmssl|salts_crypto|crypto_provider|crypto_tls') {
            throw 'M6 host directly links CNet/Crypto; plugin isolation unproven'
          }
      - name: Preserve exact-head Windows static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-static-m0-x64-windows
          path: |
            ${{ runner.temp }}/crypto-static-audit.json
            ${{ runner.temp }}/cnet-static-imports.txt
            ${{ runner.temp }}/cnet-static-owner-imports.txt
            ${{ runner.temp }}/cnet-m6-owner-imports.txt
            ${{ runner.temp }}/cnet-m6-host-imports.txt
            ${{ runner.temp }}/cnet-m6-plugin-a-imports.txt
            ${{ runner.temp }}/cnet-m6-plugin-b-imports.txt
            ${{ runner.temp }}/core-static-build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/core-static-owner-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
