name: Original CNet Owner Crypto TLS DSO full native ASan UBSan TSan (Draft)

on:
  pull_request:
    paths:
      - ".github/workflows/cnet-crypto-linked-owner-sanitizers.yml"
      - "cmake/SaltsCoreCNetCryptoQualification.cmake"
      - "src/cnet/cnet_tls_crypto_qualification.c"
      - "tests/cnet-crypto-owner/**"
      - "tests/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  original-cnet-crypto-source-san:
    name: "Linux real CNet Owner/GmSSL/Crypto ${{ matrix.kind }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        kind: [asan-ubsan, tsan]
    env:
      VCPKG_MANIFEST_FEATURES: cnet
      VCPKG_DEFAULT_TRIPLET: x64-linux
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=23
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - name: Exact linked original Owner candidate
        uses: actions/checkout@v4
      - name: Exact qualified Crypto one-image native provider and CipherBIO
        uses: actions/checkout@v4
        with:
          repository: qigao/crypto
          ref: 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          path: _crypto
          persist-credentials: false
      - name: Original pinned GmSSL private source
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Install actual C11 original CNet native dependency build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm re2c autoconf automake libtool \
            curl zip unzip tar
      - name: Bootstrap pinned original CNet vcpkg source/registry baseline
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cnet-linked-owner-vcpkg"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --no-tags origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" checkout --detach FETCH_HEAD
          git -C "$root" fetch --no-tags origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          test "$(git -C "$root" rev-parse HEAD)" = 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          git -C "$root" cat-file -e 'b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01:versions/baseline.json'
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Restore pinned dependency binary cache (not sanitizer evidence)
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: saltscore-cnet-x64-linux-v8-04a9d8e5-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Select one strict sanitizer and verify exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == tsan ]]; then
            sanitize='-fsanitize=thread'
          else
            sanitize='-fsanitize=address,undefined'
          fi
          flags="-O1 -g -fno-omit-frame-pointer $sanitize"
          echo "SOURCE_SANITIZER=$sanitize" >> "$GITHUB_ENV"
          echo "SOURCE_CFLAGS=$flags" >> "$GITHUB_ENV"
          test "$(git -C _crypto rev-parse HEAD)" = 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          python3 _crypto/tools/verify_gmssl_import.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/owner-san-source.json" \
            -P _crypto/tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/owner-san-source.json"
      - name: Compile source-instrumented pinned GmSSL static backend (not a mock)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _gmssl-upstream -B build-gmssl-san -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$SOURCE_CFLAGS" \
            "-DCMAKE_EXE_LINKER_FLAGS=$SOURCE_SANITIZER" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl-san --target gmssl --parallel 2
          test -s build-gmssl-san/bin/libgmssl.a
      - name: Build same sanitizer into ONE Crypto TLS shared DSO and CipherBIO host
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/owner-san-crypto-sdk"
          cmake -S _crypto -B build-crypto-san -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$SOURCE_CFLAGS" \
            "-DCMAKE_SHARED_LINKER_FLAGS=$SOURCE_SANITIZER" \
            "-DCMAKE_EXE_LINKER_FLAGS=$SOURCE_SANITIZER" \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl-san/bin/libgmssl.a"
          cmake --build build-crypto-san --parallel 2
          cmake --install build-crypto-san --prefix "$sdk"
          test -s "$sdk/lib/libcrypto_tls.so"
      - name: Compile full original CNet Owner and exclusive Crypto backend WITH source instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/build/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-cnet-linked-san -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=$SOURCE_CFLAGS" \
            "-DCMAKE_SHARED_LINKER_FLAGS=$SOURCE_SANITIZER" \
            "-DCMAKE_EXE_LINKER_FLAGS=$SOURCE_SANITIZER" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_MANIFEST_FEATURES=cnet \
            -DSALTSCORE_BUILD_URI=ON -DSALTSCORE_BUILD_CNET=ON \
            -DSALTSCORE_CNET_BUILD_CRYPTO_TEST_DSO=ON \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/owner-san-crypto-sdk" \
            "-DSALTSCORE_CRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/_crypto/providers/gmssl/tests/fixtures"
          cmake --build build-cnet-linked-san \
            --target saltscore_cnet_crypto_qualification \
                     saltscore_cnet_crypto_original_owner_tls \
                     saltscore_cnet_crypto_linked_owner_loopback \
                     saltscore_cnet_tcp_loopback_test --parallel 2
          test -s build-cnet-linked-san/libsaltscore_cnet_crypto_qualification.so
      - name: Run source-instrumented actual original Crypto CNet Owner TLS apps (three repetitions)
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/owner-san-crypto-sdk/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          for name in saltscore.cnet_crypto_original_owner_tls12_tls13 \
                      saltscore.cnet_crypto_linked_owner_tcp_loopback \
                      saltscore.cnet_tcp_loopback; do
            test "$(ctest --test-dir build-cnet-linked-san -N -R "^$name$" |
              sed -n 's/^Total Tests: //p')" = 1
            ctest --test-dir build-cnet-linked-san --no-tests=error \
              --output-on-failure --timeout 150 \
              -R "^$name$" --repeat until-fail:3
          done
      - name: Audit real instrumented ELF CNet/GmSSL/SaltsCore owner separation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/build-cnet-linked-san/libsaltscore_cnet_crypto_qualification.so"
          test -s "$candidate"
          readelf -d "$candidate" > "$RUNNER_TEMP/sanitized-cnet-owner-imports.txt"
          grep -q 'libcrypto_tls' "$RUNNER_TEMP/sanitized-cnet-owner-imports.txt"
          grep -q 'libsaltscore_core' "$RUNNER_TEMP/sanitized-cnet-owner-imports.txt"
          if grep -Ei 'libgmssl[.]|libcrypto_provider|libsaltscore_cnet[.]so' \
              "$RUNNER_TEMP/sanitized-cnet-owner-imports.txt"; then
            echo "Candidate loaded duplicate legacy/GmSSL library" >&2
            exit 1
          fi
      - name: Publish sanitizer source and real CNet application evidence, no TLS secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-original-owner-crypto-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/owner-san-source.json
            ${{ runner.temp }}/sanitized-cnet-owner-imports.txt
            build-cnet-linked-san/Testing/Temporary/LastTest.log
            build-cnet-linked-san/CMakeCache.txt
            build-crypto-san/CMakeCache.txt
          if-no-files-found: warn
