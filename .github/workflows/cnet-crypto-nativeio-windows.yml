name: CNet Crypto CipherBIO Windows IOCP real TCP handoff (test-only)

on:
  pull_request:
    paths:
      - ".github/workflows/cnet-crypto-nativeio-windows.yml"
      - "tests/crypto-nativeio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-real-iocp:
    name: Windows 2025 real IOCP OVERLAPPED Crypto TLS1.2/1.3
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact SaltsCore test branch
        uses: actions/checkout@v4
      - name: Independently pinned single Crypto GmSSL owner with bounded BIO
        uses: actions/checkout@v4
        with:
          repository: qigao/crypto
          ref: 369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          path: _crypto
          persist-credentials: false
      - name: Immutable original GmSSL source
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Replay exact pinned GmSSL without altering production registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _crypto rev-parse HEAD)" = \
            369b4dd7b2863cca2be8f939a6c5a834ecf5663d
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = \
            7c9f02904ef33e59c87b4f16621cc8fd434e7579
          python3 _crypto/tools/verify_gmssl_import.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/crypto-windows-iocp-source.json" \
            -P _crypto/tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/crypto-windows-iocp-source.json"
      - name: Compile exact private real GmSSL source on MSVC
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _gmssl-upstream -B build-gmssl -G 'Visual Studio 18 2026' -A x64 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --config Release --target gmssl --parallel 2
          test -s build-gmssl/bin/Release/gmssl.lib
      - name: Install ONE Crypto native shared owner and host CipherBIO
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cnet-iocp-sdk"
          cmake -S _crypto -B build-crypto -G 'Visual Studio 18 2026' -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl/bin/Release/gmssl.lib"
          cmake --build build-crypto --config Release --parallel 2
          cmake --install build-crypto --config Release --prefix "$sdk"
          test -s "$sdk/bin/crypto_tls.dll"
          test -s "$sdk/lib/crypto_tls_cipher_bio.lib"
          test -s "$sdk/include/crypto/cipher_bio.h"
      - name: Install Windows SaltsCore Core and ACTUAL NativeIO IOCP DLLs
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cnet-iocp-sdk"
          cmake -S . -B build-core -G 'Visual Studio 18 2026' -A x64 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DSALTSCORE_BUILD_URI=OFF -DSALTSCORE_BUILD_CNET=OFF
          cmake --build build-core --config Release --parallel 2
          cmake --install build-core --config Release --prefix "$sdk"
          test -s "$sdk/bin/saltscore_native_io-0.1.dll"
          test -s "$sdk/bin/saltscore_core-0.1.dll"
          test ! -e "$sdk/include/cnet/cnet.h"
      - name: Build independent Windows IOCP C11 TCP TLS consumer from installed prefixes
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cnet-iocp-sdk"
          cmake -S tests/crypto-nativeio -B build-crypto-iocp \
            -G 'Visual Studio 18 2026' -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$sdk" \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/_crypto/providers/gmssl/tests/fixtures"
          cmake --build build-crypto-iocp --config Release --parallel 2
          test "$(ctest --test-dir build-crypto-iocp -C Release -N |
            sed -n 's/^Total Tests: //p')" = 1
      - name: Execute real WSASocket overlapped IOCP TLS1.2/1.3 and drain 3x
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/cnet-iocp-sdk"
          export PATH="$(cygpath -u "$sdk")/bin:$PATH"
          ctest --test-dir build-crypto-iocp -C Release \
            -R '^cnet[.]crypto_nativeio_real_tcp_tls12_tls13$' \
            --no-tests=error --output-on-failure --timeout 120 \
            --repeat until-fail:3
      - name: Audit Windows imported DLL closure without GmSSL fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess, sys
          dll_dir = Path(os.environ["RUNNER_TEMP"])/"cnet-iocp-sdk"/"bin"
          for name in ("crypto_tls.dll", "saltscore_core-0.1.dll", "saltscore_native_io-0.1.dll"):
              if not (dll_dir/name).is_file():
                  raise SystemExit(f"Missing exact installed single owner DLL {name}")
          if any(p.name.lower().startswith(("gmssl", "crypto_provider"))
                 for p in dll_dir.glob("*.dll")):
              raise SystemExit("Unexpected duplicate native GmSSL Provider DLL in SDK")
          # Resolve the actual MSVC installation directly with vswhere,
          # rather than recursively scanning all of Program Files (slow).
          vswhere = Path("C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe")
          if not vswhere.is_file():
              raise SystemExit("MSVC vswhere.exe unavailable: cannot verify actual linker imports")
          result = subprocess.run([
              str(vswhere), "-latest", "-products", "*",
              "-property", "installationPath"
          ], check=True, capture_output=True, text=True)
          installation = Path(result.stdout.strip())
          if not installation.is_dir():
              raise SystemExit("vswhere did not resolve a real MSVC installation")
          candidates = sorted(
              (installation / "VC" / "Tools" / "MSVC").glob(
                  "*/bin/Hostx64/x64/dumpbin.exe"
              ),
              reverse=True
          )
          if not candidates:
              raise SystemExit("MSVC dumpbin.exe unavailable: cannot substitute linker assumptions")
          bins = list(Path("build-crypto-iocp").rglob(
              "saltscore_crypto_nativeio_real_tcp_tls.exe"))
          if len(bins) != 1:
              raise SystemExit(f"Expected exactly one actual IOCP test executable, found {bins}")
          def imported_names(image):
              data = subprocess.run(
                  [str(candidates[0]), "/dependents", str(image)],
                  check=True, capture_output=True, text=True
              ).stdout
              return set(x.lower() for x in re.findall(
                  r"(?i)\b[A-Za-z0-9_.-]+[.]dll\b", data))
          # Check the executable's immediate owners, then recurse through
          # ONLY the exact installed DLL closure. Some MSVC linkers place
          # Foundation behind NativeIO rather than a direct EXE import.
          direct = imported_names(bins[0])
          for required in ("crypto_tls.dll", "saltscore_native_io-0.1.dll"):
              if required not in direct:
                  raise SystemExit(f"Missing mandatory direct native DLL import: {required}; actual={sorted(direct)}")
          sdk_modules = {p.name.lower(): p for p in dll_dir.glob('*.dll')}
          seen = set()
          pending = [bins[0]]
          imported = set()
          while pending:
              image = pending.pop()
              key = str(image.resolve()).lower()
              if key in seen:
                  continue
              seen.add(key)
              linked = imported_names(image)
              imported.update(linked)
              for dep_name in linked:
                  dll = sdk_modules.get(dep_name)
                  if dll is not None:
                      pending.append(dll)
          if "saltscore_core-0.1.dll" not in imported:
              raise SystemExit(f"Missing Core Foundation runtime from full installed DLL closure: {sorted(imported)}")
          if any("gmssl" in name or "crypto_provider" in name for name in imported):
              raise SystemExit("A second native GmSSL provider is imported")
          if sum(1 for name in sdk_modules if name == 'crypto_tls.dll') != 1:
              raise SystemExit("Expected exactly one physical installed Crypto TLS DLL")
          print("Windows IOCP verified direct and transitive native DLL imports:", sorted(imported))
          report = Path(os.environ["RUNNER_TEMP"])/"cnet-iocp-imports.txt"
          report.write_text("\n".join(sorted(imported))+"\n", encoding="utf-8")
          print("Windows real IOCP binary imports verified; one Crypto shared image")
          PY
      - name: Publish C11 installed IOCP evidence without certificates or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnet-crypto-windows-real-iocp-evidence
          path: |
            ${{ runner.temp }}/crypto-windows-iocp-source.json
            ${{ runner.temp }}/cnet-iocp-imports.txt
            build-crypto-iocp/Testing/Temporary/LastTest.log
            build-crypto-iocp/CMakeCache.txt
          if-no-files-found: warn
